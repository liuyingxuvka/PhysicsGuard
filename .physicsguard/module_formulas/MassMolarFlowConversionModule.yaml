schema: physicsguard.project_formula.v1
module_type: MassMolarFlowConversionModule
owner: physicsguard.project_formula.mass_molar_flow.v1
purpose: Independently state the single-species mass and molar-flow conversion used by the exact scenario.
direction_scope: exact_instantiation_scenario
relation_directionality: direction_neutral
configuration:
  - {name: molar_mass_kg_mol, dimension: molar_mass, unit: kg/mol, required: true, default: null, constraints: [molar_mass_kg_mol > 0]}
  - {name: residual_scale_kg_s, dimension: mass_flow, unit: kg/s, required: false, default: 0.001, constraints: [residual_scale_kg_s > 0]}
scenario_inputs: [{name: n_dot_mol_s, dimension: molar_flow, unit: mol/s}]
scenario_outputs: [{name: m_dot_kg_s, dimension: mass_flow, unit: kg/s}]
residuals:
  - name: mass_molar_flow_conversion
    expression: m_dot_kg_s - n_dot_mol_s * molar_mass_kg_mol
    dimension: mass_flow
    unit: kg/s
    dimensional_derivation: mol/s multiplied by kg/mol reduces to kg/s.
    scale_expression: residual_scale_kg_s
    zero_condition: Mass flow equals molar flow multiplied by configured molar mass.
    source_intermediates: [{symbol: n_dot, expression: n_dot_mol_s}, {symbol: m_dot, expression: m_dot_kg_s}]
constraints:
  constructor:
    - {predicate: molar_mass_kg_mol > 0, guard_signature: "required_positive(parameters, 'molar_mass_kg_mol')", failure_type: ValueError, message_selector: molar_mass_kg_mol, on_violation: Reject non-positive molar_mass_kg_mol., cases: [{kind: inside, inputs: {molar_mass_kg_mol: 2.0}, expected: pass}, {kind: boundary, inputs: {molar_mass_kg_mol: 0.0}, expected: fail}, {kind: outside, inputs: {molar_mass_kg_mol: -1.0}, expected: fail}]}
    - {predicate: residual_scale_kg_s > 0, guard_signature: "positive_float(parameters.get('residual_scale_kg_s', 1e-3), 'residual_scale_kg_s')", failure_type: ValueError, message_selector: residual_scale_kg_s, on_violation: Reject non-positive residual_scale_kg_s., cases: [{kind: inside, inputs: {residual_scale_kg_s: 0.001}, expected: pass}, {kind: boundary, inputs: {residual_scale_kg_s: 0.0}, expected: fail}, {kind: outside, inputs: {residual_scale_kg_s: -1.0}, expected: fail}]}
  evaluation: []
regions:
  valid:
    - {predicate: "molar_mass_kg_mol > 0 and residual_scale_kg_s > 0", meaning: Signed single-species flow conversion with positive molar mass and normalization., cases: [{kind: inside, inputs: {molar_mass_kg_mol: 2.0, residual_scale_kg_s: 0.001}, expected: pass}, {kind: boundary, inputs: {molar_mass_kg_mol: 1e-12, residual_scale_kg_s: 0.001}, expected: pass}, {kind: outside, inputs: {molar_mass_kg_mol: 0.0, residual_scale_kg_s: 0.001}, expected: fail}]}
  invalid:
    - {predicate: "molar_mass_kg_mol <= 0 or residual_scale_kg_s <= 0", meaning: Invalid molar mass or normalization configuration., cases: [{kind: inside, inputs: {molar_mass_kg_mol: 0.0, residual_scale_kg_s: 0.001}, expected: pass}, {kind: boundary, inputs: {molar_mass_kg_mol: 1e-12, residual_scale_kg_s: 0.001}, expected: fail}, {kind: outside, inputs: {molar_mass_kg_mol: 2.0, residual_scale_kg_s: 0.001}, expected: fail}]}
assumptions: [Single species, Constant molar mass, No composition or reaction model]
validity: [Both flows use the same signed direction, Scenario roles do not make the relation intrinsically directional]
oracle_cases:
  - {case_id: balanced, inputs: {molar_mass_kg_mol: 2.0, residual_scale_kg_s: 0.001, n_dot_mol_s: 0.002, m_dot_kg_s: 0.004}, expected: {mass_molar_flow_conversion: 0.0}, tolerance: 1e-12}
  - {case_id: mass_offset, inputs: {molar_mass_kg_mol: 2.0, residual_scale_kg_s: 0.001, n_dot_mol_s: 0.002, m_dot_kg_s: 0.005}, expected: {mass_molar_flow_conversion: 0.001}, tolerance: 1e-12}
claim_boundary: This is a constant-molar-mass algebraic conversion, not a composition or reaction model.
