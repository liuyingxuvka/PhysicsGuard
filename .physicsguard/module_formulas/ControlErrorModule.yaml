schema: physicsguard.project_formula.v1
module_type: ControlErrorModule
owner: physicsguard.module_semantics.source_first.ControlErrorModule
purpose: Source-first reconstruction of the exact maintained implementation, configuration, scenario ports, state roles, residuals,
  and protected failure.
authoring_status: source_first_reconstruction_pending_independent_review
separate_review_status: pending
physical_claim_licensed: false
direction_scope: exact_instantiation_source_first_reconstruction
relation_directionality: direction_neutral
configuration:
- name: error_initial_guess
  dimension: dimensionless
  unit: '1'
  required: false
  default: 0.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''error''}_initial_guess", 0.0), f"{''error''}_initial_guess")'
- name: error_lower_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: -1000000000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''error''}_lower_bound", -1000000000.0), f"{''error''}_lower_bound")'
- name: error_scale
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1.0
  constraints:
  - 'Maintained source guard: _positive_float(parameters.get(f"{''error''}_scale", 1.0), f"{''error''}_scale")'
- name: error_upper_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1000000000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''error''}_upper_bound", 1000000000.0), f"{''error''}_upper_bound")'
- name: measurement_initial_guess
  dimension: dimensionless
  unit: '1'
  required: false
  default: 0.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''measurement''}_initial_guess", 0.0), f"{''measurement''}_initial_guess")'
- name: measurement_lower_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: -1000000000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''measurement''}_lower_bound", -1000000000.0), f"{''measurement''}_lower_bound")'
- name: measurement_scale
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1.0
  constraints:
  - 'Maintained source guard: _positive_float(parameters.get(f"{''measurement''}_scale", 1.0), f"{''measurement''}_scale")'
- name: measurement_upper_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1000000000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''measurement''}_upper_bound", 1000000000.0), f"{''measurement''}_upper_bound")'
- name: residual_scale
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1.0
  constraints:
  - 'Maintained source guard: _positive_float(parameters.get(''residual_scale'', 1.0), ''residual_scale'')'
- name: setpoint_initial_guess
  dimension: dimensionless
  unit: '1'
  required: false
  default: 0.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''setpoint''}_initial_guess", 0.0), f"{''setpoint''}_initial_guess")'
- name: setpoint_lower_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: -1000000000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''setpoint''}_lower_bound", -1000000000.0), f"{''setpoint''}_lower_bound")'
- name: setpoint_scale
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1.0
  constraints:
  - 'Maintained source guard: _positive_float(parameters.get(f"{''setpoint''}_scale", 1.0), f"{''setpoint''}_scale")'
- name: setpoint_upper_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1000000000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''setpoint''}_upper_bound", 1000000000.0), f"{''setpoint''}_upper_bound")'
scenario_inputs:
- name: setpoint
  dimension: dimensionless
  unit: '1'
  role: input
- name: measurement
  dimension: dimensionless
  unit: '1'
  role: input
scenario_outputs:
- name: error
  dimension: dimensionless
  unit: '1'
  role: output
residuals:
- name: control_error
  expression: error - (setpoint - measurement)
  dimension: dimensionless
  unit: '1'
  dimensional_derivation: The exact maintained-source relation is normalized in 1; physical meaning remains pending separate
    review.
  scale_expression: residual_scale
  zero_condition: The exact source-first relation control_error evaluates to zero.
constraints:
  constructor:
  - predicate: residual_scale > 0
    guard_signature: _positive_float(parameters.get('residual_scale', 1.0), 'residual_scale')
    failure_type: ValueError
    message_selector: residual_scale
    on_violation: Reject non-positive residual_scale through the maintained source guard.
    cases:
    - kind: inside
      inputs:
        residual_scale: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale: -1.0
      expected: fail
  evaluation: []
regions:
  valid:
  - predicate: residual_scale > 0
    meaning: The protected maintained constructor guard accepts this region.
    cases:
    - kind: inside
      inputs:
        residual_scale: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale: -1.0
      expected: fail
  invalid:
  - predicate: not (residual_scale > 0)
    meaning: The protected maintained constructor guard rejects this region.
    cases:
    - kind: inside
      inputs:
        residual_scale: -1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: pass
    - kind: outside
      inputs:
        residual_scale: 1.0
      expected: fail
assumptions:
- This reconstruction describes the exact bound current source and example only.
- No physical truth or cross-target generalization is licensed by source agreement.
validity:
- Use only while the bound implementation, exact instantiation, formula, ports, and tests retain matching fingerprints.
invariants:
- All maintained constructor parameters have explicit source provenance.
- Scenario ports exactly cover every current local declaration and referenced external variable.
effects:
- Read the exact bound scenario ports and emit 1 named residual record(s) without mutating the solver vector.
postconditions:
- Every emitted record keeps its source name, role, positive scale, diagnostic key, and source-bound arithmetic.
termination: Finite algebraic source-first evaluation terminates without retry or hidden iteration.
behavior_contract:
  kind: residual_equations
  residuals:
  - control_error
  input_ports:
  - setpoint
  - measurement
  output_ports:
  - error
oracle_cases:
- case_id: exact_bound_current_source
  inputs:
    residual_scale: 1.0
    setpoint_lower_bound: -1000000000.0
    setpoint_upper_bound: 1000000000.0
    setpoint_initial_guess: 0.0
    setpoint_scale: 1.0
    measurement_lower_bound: -1000000000.0
    measurement_upper_bound: 1000000000.0
    measurement_initial_guess: 0.0
    measurement_scale: 1.0
    error_lower_bound: -1000000000.0
    error_upper_bound: 1000000000.0
    error_initial_guess: 0.0
    error_scale: 1.0
    setpoint: 0.0
    measurement: 0.0
    error: 0.0
  expected:
    control_error: 0.0
  tolerance: 1.0e-09
claim_boundary: This is an unlicensed source-first reconstruction for one exact maintained instantiation. It does not prove
  physical correctness, external FMI coverage, or arbitrary-target reconstruction until separate evidence accepts those claims.
