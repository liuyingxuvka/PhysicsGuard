schema: physicsguard.project_formula.v1
module_type: LinearRelationModule
owner: physicsguard.project_formula.generic_linear_relation.v1
purpose: Independently state the generic non-physical linear relation used to validate the residual framework.
direction_scope: exact_instantiation_scenario
relation_directionality: direction_neutral
configuration:
  - {name: a, dimension: dimensionless, unit: '1', required: false, default: 1.0, constraints: []}
  - {name: b, dimension: dimensionless, unit: '1', required: false, default: 0.0, constraints: []}
  - {name: residual_scale, dimension: dimensionless, unit: '1', required: false, default: 1.0, constraints: [residual_scale > 0]}
scenario_inputs: [{name: x, dimension: dimensionless, unit: '1'}]
scenario_outputs: [{name: y, dimension: dimensionless, unit: '1'}]
residuals:
  - name: linear_relation
    expression: y - (a * x + b)
    dimension: dimensionless
    unit: '1'
    dimensional_derivation: This exact framework scenario uses dimensionless x, y, gain, and offset, so the residual is dimensionless.
    scale_expression: residual_scale
    zero_condition: y equals a multiplied by x plus b.
    source_intermediates: [{symbol: x_value, expression: x}, {symbol: y_value, expression: y}]
constraints:
  constructor:
    - {predicate: residual_scale > 0, guard_signature: "_positive_float(parameters.get('residual_scale', 1.0), 'residual_scale')", failure_type: ValueError, message_selector: residual_scale, on_violation: Reject non-positive residual_scale., cases: [{kind: inside, inputs: {residual_scale: 1.0}, expected: pass}, {kind: boundary, inputs: {residual_scale: 0.0}, expected: fail}, {kind: outside, inputs: {residual_scale: -1.0}, expected: fail}]}
  evaluation: []
regions:
  valid:
    - {predicate: residual_scale > 0, meaning: Finite dimensionless linear-relation scenario with positive normalization., cases: [{kind: inside, inputs: {residual_scale: 1.0}, expected: pass}, {kind: boundary, inputs: {residual_scale: 0.0}, expected: fail}, {kind: outside, inputs: {residual_scale: -1.0}, expected: fail}]}
  invalid:
    - {predicate: residual_scale <= 0, meaning: Invalid non-positive normalization scale., cases: [{kind: inside, inputs: {residual_scale: 0.0}, expected: pass}, {kind: boundary, inputs: {residual_scale: 1e-12}, expected: fail}, {kind: outside, inputs: {residual_scale: 1.0}, expected: fail}]}
assumptions: [Framework validation only, No physical meaning is assigned, This exact scenario uses dimensionless variables]
validity: [a b x and y are finite, Scenario roles do not make the relation intrinsically directional]
oracle_cases:
  - {case_id: balanced, inputs: {a: 2.0, b: 1.0, residual_scale: 1.0, x: 2.0, y: 5.0}, expected: {linear_relation: 0.0}, tolerance: 1e-12}
  - {case_id: output_offset, inputs: {a: 2.0, b: 1.0, residual_scale: 1.0, x: 2.0, y: 4.0}, expected: {linear_relation: -1.0}, tolerance: 1e-12}
claim_boundary: This is a generic framework-validation equation and carries no physical claim.
