schema: physicsguard.project_formula.v1
module_type: ThermalConductorModule
owner: physicsguard.module_semantics.source_first.ThermalConductorModule
purpose: Source-first reconstruction of the exact maintained implementation, configuration, scenario ports, state roles, residuals,
  and protected failure.
authoring_status: source_first_reconstruction_pending_independent_review
separate_review_status: pending
physical_claim_licensed: false
direction_scope: exact_instantiation_source_first_reconstruction
relation_directionality: direction_neutral
configuration:
- name: G_W_K
  dimension: conductance
  unit: W/K
  required: true
  default: null
  constraints:
  - 'Maintained source guard: _required_positive(parameters, ''G_W_K'')'
- name: Q_dot_initial_guess
  dimension: power
  unit: W
  required: false
  default: 1000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(''Q_dot_initial_guess'', 1000.0), ''Q_dot_initial_guess'')'
- name: Q_dot_lower_bound
  dimension: power
  unit: W
  required: false
  default: -10000000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(''Q_dot_lower_bound'', -10000000.0), ''Q_dot_lower_bound'')'
- name: Q_dot_scale
  dimension: power
  unit: W
  required: false
  default: 1000.0
  constraints:
  - 'Maintained source guard: _positive_float(parameters.get(''Q_dot_scale'', 1000.0), ''Q_dot_scale'')'
- name: Q_dot_upper_bound
  dimension: power
  unit: W
  required: false
  default: 10000000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(''Q_dot_upper_bound'', 10000000.0), ''Q_dot_upper_bound'')'
- name: T_a_initial_guess
  dimension: temperature
  unit: K
  required: false
  default: 320.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(''T_a_initial_guess'', 320.0), ''T_a_initial_guess'')'
- name: T_b_initial_guess
  dimension: temperature
  unit: K
  required: false
  default: 300.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(''T_b_initial_guess'', 300.0), ''T_b_initial_guess'')'
- name: T_lower_bound
  dimension: temperature
  unit: K
  required: false
  default: 200.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(''T_lower_bound'', 200.0), ''T_lower_bound'')'
- name: T_scale
  dimension: temperature
  unit: K
  required: false
  default: 10.0
  constraints:
  - 'Maintained source guard: _positive_float(parameters.get(''T_scale'', 10.0), ''T_scale'')'
- name: T_upper_bound
  dimension: temperature
  unit: K
  required: false
  default: 1000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(''T_upper_bound'', 1000.0), ''T_upper_bound'')'
- name: residual_scale_W
  dimension: power
  unit: W
  required: false
  default: 1000.0
  constraints:
  - 'Maintained source guard: _positive_float(parameters.get(''residual_scale_W'', 1000.0), ''residual_scale_W'')'
scenario_inputs:
- name: T_a_K
  dimension: temperature
  unit: K
  role: input
- name: T_b_K
  dimension: temperature
  unit: K
  role: input
scenario_outputs:
- name: Q_dot_W
  dimension: power
  unit: W
  role: output
residuals:
- name: thermal_conductor
  expression: Q_dot_W - G_W_K * (T_a_K - T_b_K)
  dimension: power
  unit: W
  dimensional_derivation: The exact maintained-source relation is normalized in W; physical meaning remains pending separate
    review.
  scale_expression: residual_scale_W
  zero_condition: The exact source-first relation thermal_conductor evaluates to zero.
constraints:
  constructor:
  - predicate: residual_scale_W > 0
    guard_signature: _positive_float(parameters.get('residual_scale_W', 1000.0), 'residual_scale_W')
    failure_type: ValueError
    message_selector: residual_scale_W
    on_violation: Reject non-positive residual_scale_W through the maintained source guard.
    cases:
    - kind: inside
      inputs:
        residual_scale_W: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale_W: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale_W: -1.0
      expected: fail
  evaluation: []
regions:
  valid:
  - predicate: residual_scale_W > 0
    meaning: The protected maintained constructor guard accepts this region.
    cases:
    - kind: inside
      inputs:
        residual_scale_W: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale_W: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale_W: -1.0
      expected: fail
  invalid:
  - predicate: not (residual_scale_W > 0)
    meaning: The protected maintained constructor guard rejects this region.
    cases:
    - kind: inside
      inputs:
        residual_scale_W: -1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale_W: 0.0
      expected: pass
    - kind: outside
      inputs:
        residual_scale_W: 1.0
      expected: fail
assumptions:
- This reconstruction describes the exact bound current source and example only.
- No physical truth or cross-target generalization is licensed by source agreement.
validity:
- Use only while the bound implementation, exact instantiation, formula, ports, and tests retain matching fingerprints.
invariants:
- All maintained constructor parameters have explicit source provenance.
- Scenario ports exactly cover every current local declaration and referenced external variable.
effects:
- Read the exact bound scenario ports and emit 1 named residual record(s) without mutating the solver vector.
postconditions:
- Every emitted record keeps its source name, role, positive scale, diagnostic key, and source-bound arithmetic.
termination: Finite algebraic source-first evaluation terminates without retry or hidden iteration.
behavior_contract:
  kind: residual_equations
  residuals:
  - thermal_conductor
  input_ports:
  - T_a_K
  - T_b_K
  output_ports:
  - Q_dot_W
oracle_cases:
- case_id: exact_bound_current_source
  inputs:
    G_W_K: 60.0
    residual_scale_W: 1000.0
    T_lower_bound: 200.0
    T_upper_bound: 1000.0
    T_a_initial_guess: 320.0
    T_scale: 10.0
    T_b_initial_guess: 300.0
    Q_dot_lower_bound: -10000000.0
    Q_dot_upper_bound: 10000000.0
    Q_dot_initial_guess: 1000.0
    Q_dot_scale: 1000.0
    T_a_K: 320.0
    T_b_K: 300.0
    Q_dot_W: 1000.0
  expected:
    thermal_conductor: -200.0
  tolerance: 1.0e-09
claim_boundary: This is an unlicensed source-first reconstruction for one exact maintained instantiation. It does not prove
  physical correctness, external FMI coverage, or arbitrary-target reconstruction until separate evidence accepts those claims.
