schema: physicsguard.project_formula.v1
module_type: RateLimiterModule
owner: physicsguard.module_semantics.source_first.RateLimiterModule
purpose: Source-first reconstruction of the exact maintained implementation, configuration, scenario ports, state roles, residuals,
  and protected failure.
authoring_status: source_first_reconstruction_pending_independent_review
separate_review_status: pending
physical_claim_licensed: false
direction_scope: exact_instantiation_source_first_reconstruction
relation_directionality: direction_neutral
configuration:
- name: dt_s
  dimension: duration
  unit: s
  required: true
  default: null
  constraints:
  - 'Maintained source guard: _required_positive(parameters, ''dt_s'')'
- name: falling_rate_limit
  dimension: dimensionless
  unit: '1'
  required: true
  default: null
  constraints:
  - 'Maintained source guard: _required(parameters, ''falling_rate_limit'')'
- name: residual_scale
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1.0
  constraints:
  - 'Maintained source guard: _positive_float(parameters.get(''residual_scale'', 1.0), ''residual_scale'')'
- name: rising_rate_limit
  dimension: dimensionless
  unit: '1'
  required: true
  default: null
  constraints:
  - 'Maintained source guard: _required(parameters, ''rising_rate_limit'')'
- name: y_current_initial_guess
  dimension: dimensionless
  unit: '1'
  required: false
  default: 0.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''y_current''}_initial_guess", 0.0), f"{''y_current''}_initial_guess")'
- name: y_current_lower_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: -1000000000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''y_current''}_lower_bound", -1000000000.0), f"{''y_current''}_lower_bound")'
- name: y_current_scale
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1.0
  constraints:
  - 'Maintained source guard: _positive_float(parameters.get(f"{''y_current''}_scale", 1.0), f"{''y_current''}_scale")'
- name: y_current_upper_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1000000000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''y_current''}_upper_bound", 1000000000.0), f"{''y_current''}_upper_bound")'
- name: y_previous_initial_guess
  dimension: dimensionless
  unit: '1'
  required: false
  default: 0.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''y_previous''}_initial_guess", 0.0), f"{''y_previous''}_initial_guess")'
- name: y_previous_lower_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: -1000000000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''y_previous''}_lower_bound", -1000000000.0), f"{''y_previous''}_lower_bound")'
- name: y_previous_scale
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1.0
  constraints:
  - 'Maintained source guard: _positive_float(parameters.get(f"{''y_previous''}_scale", 1.0), f"{''y_previous''}_scale")'
- name: y_previous_upper_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1000000000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''y_previous''}_upper_bound", 1000000000.0), f"{''y_previous''}_upper_bound")'
scenario_inputs:
- name: y_previous
  dimension: dimensionless
  unit: '1'
  role: state_previous
scenario_outputs:
- name: y_current
  dimension: dimensionless
  unit: '1'
  role: state_current
residuals:
- name: rate_limiter
  expression: (y_current - y_previous) / dt_s - rising_rate_limit if (y_current - y_previous) / dt_s > rising_rate_limit else
    (y_current - y_previous) / dt_s - falling_rate_limit if (y_current - y_previous) / dt_s < falling_rate_limit else 0.0
  dimension: dimensionless
  unit: '1'
  dimensional_derivation: The exact maintained-source relation is normalized in 1; physical meaning remains pending separate
    review.
  scale_expression: residual_scale
  zero_condition: The exact source-first relation rate_limiter evaluates to zero.
constraints:
  constructor:
  - predicate: residual_scale > 0
    guard_signature: _positive_float(parameters.get('residual_scale', 1.0), 'residual_scale')
    failure_type: ValueError
    message_selector: residual_scale
    on_violation: Reject non-positive residual_scale through the maintained source guard.
    cases:
    - kind: inside
      inputs:
        residual_scale: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale: -1.0
      expected: fail
  evaluation: []
regions:
  valid:
  - predicate: residual_scale > 0
    meaning: The protected maintained constructor guard accepts this region.
    cases:
    - kind: inside
      inputs:
        residual_scale: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale: -1.0
      expected: fail
  invalid:
  - predicate: not (residual_scale > 0)
    meaning: The protected maintained constructor guard rejects this region.
    cases:
    - kind: inside
      inputs:
        residual_scale: -1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: pass
    - kind: outside
      inputs:
        residual_scale: 1.0
      expected: fail
assumptions:
- This reconstruction describes the exact bound current source and example only.
- No physical truth or cross-target generalization is licensed by source agreement.
validity:
- Use only while the bound implementation, exact instantiation, formula, ports, and tests retain matching fingerprints.
invariants:
- All maintained constructor parameters have explicit source provenance.
- Scenario ports exactly cover every current local declaration and referenced external variable.
effects:
- Read the exact bound scenario ports and emit 1 named residual record(s) without mutating the solver vector.
postconditions:
- Every emitted record keeps its source name, role, positive scale, diagnostic key, and source-bound arithmetic.
termination: Finite algebraic source-first evaluation terminates without retry or hidden iteration.
behavior_contract:
  kind: residual_equations
  residuals:
  - rate_limiter
  input_ports:
  - y_previous
  output_ports:
  - y_current
oracle_cases:
- case_id: exact_bound_current_source
  inputs:
    dt_s: 1.0
    rising_rate_limit: 1.0
    falling_rate_limit: -1.0
    residual_scale: 1.0
    y_previous_lower_bound: -1000000000.0
    y_previous_upper_bound: 1000000000.0
    y_previous_initial_guess: 0.0
    y_previous_scale: 1.0
    y_current_lower_bound: -1000000000.0
    y_current_upper_bound: 1000000000.0
    y_current_initial_guess: 0.0
    y_current_scale: 1.0
    y_previous: 0.0
    y_current: 0.0
  expected:
    rate_limiter: 0.0
  tolerance: 1.0e-09
claim_boundary: This is an unlicensed source-first reconstruction for one exact maintained instantiation. It does not prove
  physical correctness, external FMI coverage, or arbitrary-target reconstruction until separate evidence accepts those claims.
