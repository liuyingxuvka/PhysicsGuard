schema: physicsguard.project_formula.v1
module_type: SaturationModule
owner: physicsguard.module_semantics.source_first.SaturationModule
purpose: Source-first reconstruction of the exact maintained implementation, configuration, scenario ports, state roles, residuals,
  and protected failure.
authoring_status: source_first_reconstruction_pending_independent_review
separate_review_status: pending
physical_claim_licensed: false
direction_scope: exact_instantiation_source_first_reconstruction
relation_directionality: direction_neutral
configuration:
- name: lower
  dimension: dimensionless
  unit: '1'
  required: true
  default: null
  constraints:
  - 'Maintained source guard: parameters[''lower'']'
- name: residual_scale
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1.0
  constraints:
  - 'Maintained source guard: _positive_float(parameters.get(''residual_scale'', 1.0), ''residual_scale'')'
- name: role_override
  dimension: enum
  unit: enum
  required: false
  default: equation
  constraints:
  - 'Maintained source guard: _role(parameters.get(''role_override'', ''equation''))'
- name: u_initial_guess
  dimension: dimensionless
  unit: '1'
  required: false
  default: 0.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''u''}_initial_guess", 0.0), f"{''u''}_initial_guess")'
- name: u_lower_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: -1000000000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''u''}_lower_bound", -1000000000.0), f"{''u''}_lower_bound")'
- name: u_scale
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1.0
  constraints:
  - 'Maintained source guard: _positive_float(parameters.get(f"{''u''}_scale", 1.0), f"{''u''}_scale")'
- name: u_upper_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1000000000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''u''}_upper_bound", 1000000000.0), f"{''u''}_upper_bound")'
- name: upper
  dimension: dimensionless
  unit: '1'
  required: true
  default: null
  constraints:
  - 'Maintained source guard: parameters[''upper'']'
- name: y_initial_guess
  dimension: dimensionless
  unit: '1'
  required: false
  default: 0.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''y''}_initial_guess", 0.0), f"{''y''}_initial_guess")'
- name: y_lower_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: -1000000000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''y''}_lower_bound", -1000000000.0), f"{''y''}_lower_bound")'
- name: y_scale
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1.0
  constraints:
  - 'Maintained source guard: _positive_float(parameters.get(f"{''y''}_scale", 1.0), f"{''y''}_scale")'
- name: y_upper_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1000000000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(f"{''y''}_upper_bound", 1000000000.0), f"{''y''}_upper_bound")'
scenario_inputs:
- name: u
  dimension: dimensionless
  unit: '1'
  role: input
scenario_outputs:
- name: y
  dimension: dimensionless
  unit: '1'
  role: output
residuals:
- name: saturation
  expression: y - min(max(u, lower), upper)
  dimension: dimensionless
  unit: '1'
  dimensional_derivation: The exact maintained-source relation is normalized in 1; physical meaning remains pending separate
    review.
  scale_expression: residual_scale
  zero_condition: The exact source-first relation saturation evaluates to zero.
constraints:
  constructor:
  - predicate: residual_scale > 0
    guard_signature: _positive_float(parameters.get('residual_scale', 1.0), 'residual_scale')
    failure_type: ValueError
    message_selector: residual_scale
    on_violation: Reject non-positive residual_scale through the maintained source guard.
    cases:
    - kind: inside
      inputs:
        residual_scale: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale: -1.0
      expected: fail
  evaluation: []
regions:
  valid:
  - predicate: residual_scale > 0
    meaning: The protected maintained constructor guard accepts this region.
    cases:
    - kind: inside
      inputs:
        residual_scale: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale: -1.0
      expected: fail
  invalid:
  - predicate: not (residual_scale > 0)
    meaning: The protected maintained constructor guard rejects this region.
    cases:
    - kind: inside
      inputs:
        residual_scale: -1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: pass
    - kind: outside
      inputs:
        residual_scale: 1.0
      expected: fail
assumptions:
- This reconstruction describes the exact bound current source and example only.
- No physical truth or cross-target generalization is licensed by source agreement.
validity:
- Use only while the bound implementation, exact instantiation, formula, ports, and tests retain matching fingerprints.
invariants:
- All maintained constructor parameters have explicit source provenance.
- Scenario ports exactly cover every current local declaration and referenced external variable.
effects:
- Read the exact bound scenario ports and emit 1 named residual record(s) without mutating the solver vector.
postconditions:
- Every emitted record keeps its source name, role, positive scale, diagnostic key, and source-bound arithmetic.
termination: Finite algebraic source-first evaluation terminates without retry or hidden iteration.
behavior_contract:
  kind: residual_equations
  residuals:
  - saturation
  input_ports:
  - u
  output_ports:
  - y
oracle_cases:
- case_id: exact_bound_current_source
  inputs:
    lower: 0.0
    upper: 1.0
    role_override: equation
    residual_scale: 1.0
    u_lower_bound: -1000000000.0
    u_upper_bound: 1000000000.0
    u_initial_guess: 0.0
    u_scale: 1.0
    y_lower_bound: -1000000000.0
    y_upper_bound: 1000000000.0
    y_initial_guess: 0.0
    y_scale: 1.0
    u: 0.0
    y: 0.0
    role: equation
  expected:
    saturation: 0.0
  tolerance: 1.0e-09
claim_boundary: This is an unlicensed source-first reconstruction for one exact maintained instantiation. It does not prove
  physical correctness, external FMI coverage, or arbitrary-target reconstruction until separate evidence accepts those claims.
