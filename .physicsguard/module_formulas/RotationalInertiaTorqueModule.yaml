schema: physicsguard.project_formula.v1
module_type: RotationalInertiaTorqueModule
owner: physicsguard.module_semantics.mechanical_draft.RotationalInertiaTorqueModule
purpose: Mechanically describe the current lumped rotational inertia torque relation and exact scenario roles.
authoring_status: mechanical_draft_pending_independent_review
separate_review_status: pending
physical_claim_licensed: false
direction_scope: exact_instantiation_mechanical_draft
relation_directionality: direction_neutral
configuration:
  - {name: inertia_kg_m2, dimension: moment_of_inertia, unit: kg*m^2, required: true, default: null, constraints: [inertia_kg_m2 > 0]}
  - {name: residual_scale_Nm, dimension: torque, unit: N*m, required: false, default: 1.0, constraints: [residual_scale_Nm > 0]}
scenario_inputs:
  - {name: angular_acceleration_rad_s2, dimension: angular_acceleration, unit: rad/s^2}
scenario_outputs:
  - {name: torque_Nm, dimension: torque, unit: N*m}
residuals:
  - name: rotational_inertia_torque
    expression: torque_Nm - inertia_kg_m2 * angular_acceleration_rad_s2
    dimension: torque
    unit: N*m
    dimensional_derivation: Lumped inertia times angular acceleration has torque dimension when radians are treated as dimensionless.
    scale_expression: residual_scale_Nm
    zero_condition: Torque equals inertia times angular acceleration under the current sign convention.
    source_intermediates:
      - {symbol: acceleration, expression: angular_acceleration_rad_s2}
      - {symbol: torque, expression: torque_Nm}
constraints:
  constructor:
    - {predicate: inertia_kg_m2 > 0, guard_signature: "required_positive(parameters, 'inertia_kg_m2')", failure_type: ValueError, message_selector: inertia_kg_m2, on_violation: Reject missing or non-positive inertia., cases: [{kind: inside, inputs: {inertia_kg_m2: 2.0}, expected: pass}, {kind: boundary, inputs: {inertia_kg_m2: 0.0}, expected: fail}, {kind: outside, inputs: {inertia_kg_m2: -1.0}, expected: fail}]}
    - {predicate: residual_scale_Nm > 0, guard_signature: "positive_float(parameters.get('residual_scale_Nm', 1.0), 'residual_scale_Nm')", failure_type: ValueError, message_selector: residual_scale_Nm, on_violation: Reject non-positive torque normalization., cases: [{kind: inside, inputs: {residual_scale_Nm: 1.0}, expected: pass}, {kind: boundary, inputs: {residual_scale_Nm: 0.0}, expected: fail}, {kind: outside, inputs: {residual_scale_Nm: -1.0}, expected: fail}]}
  evaluation: []
regions:
  valid:
    - {predicate: "inertia_kg_m2 > 0 and residual_scale_Nm > 0", meaning: Positive lumped inertia and torque normalization., cases: [{kind: inside, inputs: {inertia_kg_m2: 2.0, residual_scale_Nm: 1.0}, expected: pass}, {kind: boundary, inputs: {inertia_kg_m2: 0.0, residual_scale_Nm: 1.0}, expected: fail}, {kind: outside, inputs: {inertia_kg_m2: -1.0, residual_scale_Nm: 1.0}, expected: fail}]}
  invalid:
    - {predicate: "inertia_kg_m2 <= 0 or residual_scale_Nm <= 0", meaning: Invalid inertia or torque normalization., cases: [{kind: inside, inputs: {inertia_kg_m2: -1.0, residual_scale_Nm: 1.0}, expected: pass}, {kind: boundary, inputs: {inertia_kg_m2: 0.0, residual_scale_Nm: 1.0}, expected: pass}, {kind: outside, inputs: {inertia_kg_m2: 2.0, residual_scale_Nm: 1.0}, expected: fail}]}
assumptions: [Lumped rotational inertia, No friction gearbox or drivetrain model, Current sign convention is shared by torque and angular acceleration]
validity: [Use only for the exact current low-fidelity relation]
invariants: [Angular acceleration is read-only and torque is checked without mutation]
effects: [Emit one rotational_inertia_torque residual]
postconditions: [Residual equals torque minus inertia times angular acceleration]
termination: One multiplication and subtraction terminate.
oracle_cases:
  - {case_id: balanced, inputs: {inertia_kg_m2: 2.0, angular_acceleration_rad_s2: 3.0, torque_Nm: 6.0, residual_scale_Nm: 1.0}, expected: {rotational_inertia_torque: 0.0}, tolerance: 1.0e-12}
  - {case_id: torque_offset, inputs: {inertia_kg_m2: 2.0, angular_acceleration_rad_s2: 3.0, torque_Nm: 5.0, residual_scale_Nm: 1.0}, expected: {rotational_inertia_torque: -1.0}, tolerance: 1.0e-12}
claim_boundary: This current lumped arithmetic draft does not validate rigid-body assumptions, sign convention, inertia data, or physical correctness.
