scenario_inputs:
- name: p_in_Pa
  dimension: pressure
  unit: Pa
  role: input
- name: p_out_Pa
  dimension: pressure
  unit: Pa
  role: input
- name: m_dot_kg_s
  dimension: mass_flow
  unit: kg/s
  role: input
- name: efficiency
  dimension: dimensionless
  unit: '1'
  role: input
scenario_outputs:
- name: P_shaft_W
  dimension: power
  unit: W
  role: output
residuals:
- name: pump_power
  expression: P_shaft_W - (p_out_Pa - p_in_Pa) * m_dot_kg_s / rho_kg_m3 / efficiency
  dimension: power
  unit: W
  dimensional_derivation: The exact maintained-source relation is normalized in W; physical meaning remains pending separate
    review.
  scale_expression: residual_scale_power_W
  zero_condition: The exact source-first relation pump_power evaluates to zero.
constraints:
  constructor:
  - predicate: residual_scale_power_W > 0
    guard_signature: positive_float(parameters.get('residual_scale_power_W', 1000.0), 'residual_scale_power_W')
    failure_type: ValueError
    message_selector: residual_scale_power_W
    on_violation: Reject non-positive residual_scale_power_W through the maintained source guard.
    cases:
    - kind: inside
      inputs:
        residual_scale_power_W: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale_power_W: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale_power_W: -1.0
      expected: fail
  evaluation: []
regions:
  valid:
  - predicate: residual_scale_power_W > 0
    meaning: The protected maintained constructor guard accepts this region.
    cases:
    - kind: inside
      inputs:
        residual_scale_power_W: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale_power_W: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale_power_W: -1.0
      expected: fail
  invalid:
  - predicate: not (residual_scale_power_W > 0)
    meaning: The protected maintained constructor guard rejects this region.
    cases:
    - kind: inside
      inputs:
        residual_scale_power_W: -1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale_power_W: 0.0
      expected: pass
    - kind: outside
      inputs:
        residual_scale_power_W: 1.0
      expected: fail
assumptions:
- This reconstruction describes the exact bound current source and example only.
- No physical truth or cross-target generalization is licensed by source agreement.
validity:
- Use only while the bound implementation, exact instantiation, formula, ports, and tests retain matching fingerprints.
invariants:
- All maintained constructor parameters have explicit source provenance.
- Scenario ports exactly cover every current local declaration and referenced external variable.
effects:
- Read the exact bound scenario ports and emit 1 named residual record(s) without mutating the solver vector.
postconditions:
- Every emitted record keeps its source name, role, positive scale, diagnostic key, and source-bound arithmetic.
termination: Finite algebraic source-first evaluation terminates without retry or hidden iteration.
behavior_contract:
  kind: residual_equations
  residuals:
  - pump_power
  input_ports:
  - p_in_Pa
  - p_out_Pa
  - m_dot_kg_s
  - efficiency
  output_ports:
  - P_shaft_W
oracle_cases:
- case_id: exact_bound_current_source
  inputs:
    rho_kg_m3: 1000.0
    residual_scale_power_W: 1000.0
    p_in_lower_bound: 1000.0
    p_in_upper_bound: 100000000.0
    p_in_initial_guess: 100000.0
    p_in_scale: 100000.0
    p_out_lower_bound: 1000.0
    p_out_upper_bound: 100000000.0
    p_out_initial_guess: 200000.0
    p_out_scale: 100000.0
    m_dot_lower_bound: 0.0
    m_dot_upper_bound: 10000.0
    m_dot_initial_guess: 1.0
    m_dot_scale: 1.0
    P_shaft_lower_bound: -1000000000.0
    P_shaft_upper_bound: 1000000000.0
    P_shaft_initial_guess: 1000.0
    P_shaft_scale: 1000.0
    efficiency_lower_bound: 1.0e-09
    efficiency_upper_bound: 1.5
    efficiency_initial_guess: 0.8
    efficiency_scale: 0.1
    p_in_Pa: 100000.0
    p_out_Pa: 200000.0
    m_dot_kg_s: 1.0
    efficiency: 0.8
    P_shaft_W: 1000.0
  expected:
