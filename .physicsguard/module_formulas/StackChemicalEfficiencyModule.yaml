schema: physicsguard.project_formula.v1
module_type: StackChemicalEfficiencyModule
owner: physicsguard.project_formula.stack_chemical_efficiency.v1
purpose: Independently state the bounded stack-power to chemical-power efficiency relation used by the exact scenario.
direction_scope: exact_instantiation_scenario
relation_directionality: direction_neutral
configuration:
  - {name: residual_scale, dimension: dimensionless, unit: '1', required: false, default: 0.01, constraints: [residual_scale > 0]}
  - {name: denominator_min_abs, dimension: power, unit: W, required: false, default: 1e-9, constraints: [denominator_min_abs > 0]}
scenario_inputs:
  - {name: P_stack_W, dimension: power, unit: W}
  - {name: P_chemical_W, dimension: power, unit: W}
scenario_outputs: [{name: efficiency, dimension: dimensionless, unit: '1'}]
residuals:
  - name: stack_chemical_efficiency
    expression: efficiency - P_stack_W / P_chemical_W
    dimension: dimensionless
    unit: '1'
    dimensional_derivation: W divided by W is dimensionless, matching efficiency.
    scale_expression: residual_scale
    zero_condition: Stack chemical efficiency equals stack power divided by nonzero chemical power.
    source_intermediates: [{symbol: p_stack, expression: P_stack_W}, {symbol: p_chemical, expression: P_chemical_W}]
constraints:
  constructor:
    - {predicate: residual_scale > 0, guard_signature: "positive_float(parameters.get('residual_scale', 0.01), 'residual_scale')", failure_type: ValueError, message_selector: residual_scale, on_violation: Reject non-positive residual_scale., cases: [{kind: inside, inputs: {residual_scale: 0.01}, expected: pass}, {kind: boundary, inputs: {residual_scale: 0.0}, expected: fail}, {kind: outside, inputs: {residual_scale: -1.0}, expected: fail}]}
    - {predicate: denominator_min_abs > 0, guard_signature: "positive_float(parameters.get('denominator_min_abs', 1e-9), 'denominator_min_abs')", failure_type: ValueError, message_selector: denominator_min_abs, on_violation: Reject non-positive denominator_min_abs., cases: [{kind: inside, inputs: {denominator_min_abs: 1e-9}, expected: pass}, {kind: boundary, inputs: {denominator_min_abs: 0.0}, expected: fail}, {kind: outside, inputs: {denominator_min_abs: -1.0}, expected: fail}]}
  evaluation:
    - {predicate: "abs(P_chemical_W) >= denominator_min_abs", guard_signature: "if abs(p_chemical) < self.denominator_min_abs", failure_type: ValueError, message_selector: P_chemical_W, on_violation: Reject chemical power inside the protected denominator deadband., cases: [{kind: inside, inputs: {P_chemical_W: 1000.0, denominator_min_abs: 1e-9}, expected: pass}, {kind: boundary, inputs: {P_chemical_W: 1e-9, denominator_min_abs: 1e-9}, expected: pass}, {kind: outside, inputs: {P_chemical_W: 0.0, denominator_min_abs: 1e-9}, expected: fail}]}
regions:
  valid:
    - {predicate: "P_chemical_W >= denominator_min_abs and P_stack_W >= 0 and efficiency >= 0 and efficiency <= 1.5 and residual_scale > 0", meaning: Nonnegative stack-efficiency magnitude region outside the chemical-power deadband., cases: [{kind: inside, inputs: {P_chemical_W: 1000.0, P_stack_W: 500.0, efficiency: 0.5, denominator_min_abs: 1e-9, residual_scale: 0.01}, expected: pass}, {kind: boundary, inputs: {P_chemical_W: 1e-9, P_stack_W: 0.0, efficiency: 0.0, denominator_min_abs: 1e-9, residual_scale: 0.01}, expected: pass}, {kind: outside, inputs: {P_chemical_W: 0.0, P_stack_W: 0.0, efficiency: 0.0, denominator_min_abs: 1e-9, residual_scale: 0.01}, expected: fail}]}
  invalid:
    - {predicate: "P_chemical_W < denominator_min_abs or P_stack_W < 0 or efficiency < 0 or efficiency > 1.5 or residual_scale <= 0", meaning: Invalid chemical-power denominator stack-power efficiency or normalization region., cases: [{kind: inside, inputs: {P_chemical_W: 0.0, P_stack_W: 0.0, efficiency: 0.0, denominator_min_abs: 1e-9, residual_scale: 0.01}, expected: pass}, {kind: boundary, inputs: {P_chemical_W: 1e-9, P_stack_W: 0.0, efficiency: 0.0, denominator_min_abs: 1e-9, residual_scale: 0.01}, expected: fail}, {kind: outside, inputs: {P_chemical_W: 1000.0, P_stack_W: 500.0, efficiency: 0.5, denominator_min_abs: 1e-9, residual_scale: 0.01}, expected: fail}]}
assumptions: [Algebraic stack-to-chemical power ratio, Auxiliary loads are outside unless included in stack power, No detailed electrochemical loss model]
validity: [Chemical power is outside the protected denominator deadband, Scenario roles are one boundary assignment]
oracle_cases:
  - {case_id: balanced, inputs: {residual_scale: 0.01, denominator_min_abs: 1e-9, P_stack_W: 500.0, P_chemical_W: 1000.0, efficiency: 0.5}, expected: {stack_chemical_efficiency: 0.0}, tolerance: 1e-12}
  - {case_id: efficiency_offset, inputs: {residual_scale: 0.01, denominator_min_abs: 1e-9, P_stack_W: 500.0, P_chemical_W: 1000.0, efficiency: 0.4}, expected: {stack_chemical_efficiency: -0.1}, tolerance: 1e-12}
claim_boundary: This is a low-fidelity algebraic efficiency check, not a detailed electrochemical loss or auxiliary-power model.
