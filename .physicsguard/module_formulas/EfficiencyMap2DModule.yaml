schema: physicsguard.project_formula.v1
module_type: EfficiencyMap2DModule
owner: physicsguard.module_semantics.source_first.EfficiencyMap2DModule
purpose: Source-first reconstruction of the exact maintained implementation, configuration, scenario ports, state roles, residuals,
  and protected failure.
authoring_status: source_first_reconstruction_pending_independent_review
separate_review_status: pending
physical_claim_licensed: false
direction_scope: exact_instantiation_source_first_reconstruction
relation_directionality: direction_neutral
configuration:
- name: efficiency_initial_guess
  dimension: dimensionless
  unit: '1'
  required: false
  default: 0.8
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''efficiency_initial_guess'', 0.8), ''efficiency_initial_guess'')'
- name: efficiency_lower_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: 0.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''efficiency_lower_bound'', 0.0), ''efficiency_lower_bound'')'
- name: efficiency_scale
  dimension: dimensionless
  unit: '1'
  required: false
  default: 0.1
  constraints:
  - 'Maintained source guard: positive_float(parameters.get(''efficiency_scale'', 0.1), ''efficiency_scale'')'
- name: efficiency_upper_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1.5
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''efficiency_upper_bound'', 1.5), ''efficiency_upper_bound'')'
- name: efficiency_values
  dimension: dimensionless
  unit: '1'
  required: false
  default: null
  constraints:
  - 'Maintained source guard: parameters.get(''efficiency_values'')'
- name: extrapolation
  dimension: enum
  unit: enum
  required: false
  default: error
  constraints:
  - 'Maintained source guard: parameters.get(''extrapolation'', ''error'')'
- name: residual_scale
  dimension: dimensionless
  unit: '1'
  required: false
  default: 0.01
  constraints:
  - 'Maintained source guard: positive_float(parameters.get(''residual_scale'', 0.01), ''residual_scale'')'
- name: x_initial_guess
  dimension: dimensionless
  unit: '1'
  required: false
  default: 0.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''x_initial_guess'', 0.0), ''x_initial_guess'')'
- name: x_lower_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: -1000000000.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''x_lower_bound'', -1000000000.0), ''x_lower_bound'')'
- name: x_points
  dimension: dimensionless
  unit: '1'
  required: false
  default: null
  constraints:
  - 'Maintained source guard: parameters.get(''x_points'')'
- name: x_scale
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1.0
  constraints:
  - 'Maintained source guard: positive_float(parameters.get(''x_scale'', 1.0), ''x_scale'')'
- name: x_upper_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1000000000.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''x_upper_bound'', 1000000000.0), ''x_upper_bound'')'
- name: y_initial_guess
  dimension: dimensionless
  unit: '1'
  required: false
  default: 0.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''y_initial_guess'', 0.0), ''y_initial_guess'')'
- name: y_lower_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: -1000000000.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''y_lower_bound'', -1000000000.0), ''y_lower_bound'')'
- name: y_points
  dimension: dimensionless
  unit: '1'
  required: false
  default: null
  constraints:
  - 'Maintained source guard: parameters.get(''y_points'')'
- name: y_scale
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1.0
  constraints:
  - 'Maintained source guard: positive_float(parameters.get(''y_scale'', 1.0), ''y_scale'')'
- name: y_upper_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1000000000.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''y_upper_bound'', 1000000000.0), ''y_upper_bound'')'
scenario_inputs:
- name: x
  dimension: dimensionless
  unit: '1'
  role: input
- name: y
  dimension: dimensionless
  unit: '1'
  role: input
scenario_outputs:
- name: efficiency
  dimension: dimensionless
  unit: '1'
  role: output
residuals:
- name: efficiency_map_2d
  expression: efficiency - (efficiency_values[0][0] * (1 - (x - x_points[0]) / (x_points[1] - x_points[0])) * (1 - (y - y_points[0])
    / (y_points[1] - y_points[0])) + efficiency_values[0][1] * ((x - x_points[0]) / (x_points[1] - x_points[0])) * (1 - (y
    - y_points[0]) / (y_points[1] - y_points[0])) + efficiency_values[1][0] * (1 - (x - x_points[0]) / (x_points[1] - x_points[0]))
    * ((y - y_points[0]) / (y_points[1] - y_points[0])) + efficiency_values[1][1] * ((x - x_points[0]) / (x_points[1] - x_points[0]))
    * ((y - y_points[0]) / (y_points[1] - y_points[0])))
  dimension: dimensionless
  unit: '1'
  dimensional_derivation: The exact maintained-source relation is normalized in 1; physical meaning remains pending separate
    review.
  scale_expression: residual_scale
  zero_condition: The exact source-first relation efficiency_map_2d evaluates to zero.
constraints:
  constructor:
  - predicate: residual_scale > 0
    guard_signature: positive_float(parameters.get('residual_scale', 0.01), 'residual_scale')
    failure_type: ValueError
    message_selector: residual_scale
    on_violation: Reject non-positive residual_scale through the maintained source guard.
    cases:
    - kind: inside
      inputs:
        residual_scale: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale: -1.0
      expected: fail
  evaluation: []
regions:
  valid:
  - predicate: residual_scale > 0
    meaning: The protected maintained constructor guard accepts this region.
    cases:
    - kind: inside
      inputs:
        residual_scale: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale: -1.0
      expected: fail
  invalid:
  - predicate: not (residual_scale > 0)
    meaning: The protected maintained constructor guard rejects this region.
    cases:
    - kind: inside
      inputs:
        residual_scale: -1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: pass
    - kind: outside
      inputs:
        residual_scale: 1.0
      expected: fail
assumptions:
- This reconstruction describes the exact bound current source and example only.
- No physical truth or cross-target generalization is licensed by source agreement.
validity:
- Use only while the bound implementation, exact instantiation, formula, ports, and tests retain matching fingerprints.
invariants:
- All maintained constructor parameters have explicit source provenance.
- Scenario ports exactly cover every current local declaration and referenced external variable.
effects:
- Read the exact bound scenario ports and emit 1 named residual record(s) without mutating the solver vector.
postconditions:
- Every emitted record keeps its source name, role, positive scale, diagnostic key, and source-bound arithmetic.
termination: Finite algebraic source-first evaluation terminates without retry or hidden iteration.
behavior_contract:
  kind: residual_equations
  residuals:
  - efficiency_map_2d
  input_ports:
  - x
  - y
  output_ports:
  - efficiency
oracle_cases:
- case_id: exact_bound_current_source
  inputs:
    x_points:
    - 0.0
    - 1.0
    y_points:
    - 0.0
    - 1.0
    efficiency_values:
    - - 0.7
      - 0.8
    - - 0.8
      - 0.9
    extrapolation: error
    residual_scale: 0.01
    x_lower_bound: -1000000000.0
    x_upper_bound: 1000000000.0
    x_initial_guess: 0.0
    x_scale: 1.0
    y_lower_bound: -1000000000.0
    y_upper_bound: 1000000000.0
    y_initial_guess: 0.0
    y_scale: 1.0
    efficiency_lower_bound: 0.0
    efficiency_upper_bound: 1.5
    efficiency_initial_guess: 0.8
    efficiency_scale: 0.1
    x: 0.0
    y: 0.0
    efficiency: 0.8
  expected:
    efficiency_map_2d: 0.10000000000000009
  tolerance: 1.0e-09
claim_boundary: This is an unlicensed source-first reconstruction for one exact maintained instantiation. It does not prove
  physical correctness, external FMI coverage, or arbitrary-target reconstruction until separate evidence accepts those claims.
