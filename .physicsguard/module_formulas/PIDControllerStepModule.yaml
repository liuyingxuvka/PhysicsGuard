residuals:
- name: pid_error
  expression: error - (setpoint - measurement)
  dimension: dimensionless
  unit: '1'
  dimensional_derivation: The exact maintained-source relation is normalized in 1; physical meaning remains pending separate
    review.
  scale_expression: residual_scale_error
  zero_condition: The exact source-first relation pid_error evaluates to zero.
- name: pid_integral_step
  expression: integral_current - (integral_previous + error * dt_s)
  dimension: dimensionless
  unit: '1'
  dimensional_derivation: The exact maintained-source relation is normalized in 1; physical meaning remains pending separate
    review.
  scale_expression: residual_scale_integral
  zero_condition: The exact source-first relation pid_integral_step evaluates to zero.
- name: pid_derivative
  expression: derivative_error - (error - error_previous) / dt_s
  dimension: dimensionless
  unit: '1'
  dimensional_derivation: The exact maintained-source relation is normalized in 1; physical meaning remains pending separate
    review.
  scale_expression: residual_scale_derivative
  zero_condition: The exact source-first relation pid_derivative evaluates to zero.
- name: pid_unsaturated_output
  expression: output_unsaturated - (Kp * error + Ki * integral_current + Kd * derivative_error + bias)
  dimension: dimensionless
  unit: '1'
  dimensional_derivation: The exact maintained-source relation is normalized in 1; physical meaning remains pending separate
    review.
  scale_expression: residual_scale_output
  zero_condition: The exact source-first relation pid_unsaturated_output evaluates to zero.
- name: pid_saturated_output
  expression: output - (min(max(Kp * error + Ki * integral_current + Kd * derivative_error + bias, output_lower), output_upper)
    if output_lower is not None and output_upper is not None else max(Kp * error + Ki * integral_current + Kd * derivative_error
    + bias, output_lower) if output_lower is not None else min(Kp * error + Ki * integral_current + Kd * derivative_error
    + bias, output_upper) if output_upper is not None else Kp * error + Ki * integral_current + Kd * derivative_error + bias)
  dimension: dimensionless
  unit: '1'
  dimensional_derivation: The exact maintained-source relation is normalized in 1; physical meaning remains pending separate
    review.
  scale_expression: residual_scale_output
  zero_condition: The exact source-first relation pid_saturated_output evaluates to zero.
constraints:
  constructor:
  - predicate: residual_scale_derivative > 0
    guard_signature: positive_float(parameters.get('residual_scale_derivative', 1.0), 'residual_scale_derivative')
    failure_type: ValueError
    message_selector: residual_scale_derivative
    on_violation: Reject non-positive residual_scale_derivative through the maintained source guard.
    cases:
    - kind: inside
      inputs:
        residual_scale_derivative: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale_derivative: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale_derivative: -1.0
      expected: fail
  evaluation: []
regions:
  valid:
  - predicate: residual_scale_derivative > 0
    meaning: The protected maintained constructor guard accepts this region.
    cases:
    - kind: inside
      inputs:
        residual_scale_derivative: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale_derivative: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale_derivative: -1.0
      expected: fail
  invalid:
  - predicate: not (residual_scale_derivative > 0)
    meaning: The protected maintained constructor guard rejects this region.
    cases:
    - kind: inside
      inputs:
        residual_scale_derivative: -1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale_derivative: 0.0
      expected: pass
    - kind: outside
      inputs:
        residual_scale_derivative: 1.0
      expected: fail
