scenario_inputs:
- name: error
  dimension: dimensionless
  unit: '1'
  role: input
- name: integral_error
  dimension: dimensionless
  unit: '1'
  role: input
- name: derivative_error
  dimension: dimensionless
  unit: '1'
  role: input
scenario_outputs:
- name: output
  dimension: dimensionless
  unit: '1'
  role: output
residuals:
- name: pid_algebraic
  expression: output - (Kp * error + Ki * integral_error + Kd * derivative_error + bias)
  dimension: dimensionless
  unit: '1'
  dimensional_derivation: The exact maintained-source relation is normalized in 1; physical meaning remains pending separate
    review.
  scale_expression: residual_scale
  zero_condition: The exact source-first relation pid_algebraic evaluates to zero.
constraints:
  constructor:
  - predicate: residual_scale > 0
    guard_signature: _positive_float(parameters.get('residual_scale', 1.0), 'residual_scale')
    failure_type: ValueError
    message_selector: residual_scale
    on_violation: Reject non-positive residual_scale through the maintained source guard.
    cases:
    - kind: inside
      inputs:
        residual_scale: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale: -1.0
      expected: fail
  evaluation: []
regions:
  valid:
  - predicate: residual_scale > 0
    meaning: The protected maintained constructor guard accepts this region.
    cases:
    - kind: inside
      inputs:
        residual_scale: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale: -1.0
      expected: fail
  invalid:
  - predicate: not (residual_scale > 0)
    meaning: The protected maintained constructor guard rejects this region.
    cases:
    - kind: inside
      inputs:
        residual_scale: -1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: pass
    - kind: outside
      inputs:
        residual_scale: 1.0
      expected: fail
assumptions:
- This reconstruction describes the exact bound current source and example only.
- No physical truth or cross-target generalization is licensed by source agreement.
validity:
- Use only while the bound implementation, exact instantiation, formula, ports, and tests retain matching fingerprints.
invariants:
- All maintained constructor parameters have explicit source provenance.
- Scenario ports exactly cover every current local declaration and referenced external variable.
effects:
- Read the exact bound scenario ports and emit 1 named residual record(s) without mutating the solver vector.
postconditions:
- Every emitted record keeps its source name, role, positive scale, diagnostic key, and source-bound arithmetic.
termination: Finite algebraic source-first evaluation terminates without retry or hidden iteration.
behavior_contract:
  kind: residual_equations
  residuals:
  - pid_algebraic
  input_ports:
  - error
  - integral_error
  - derivative_error
  output_ports:
  - output
oracle_cases:
- case_id: exact_bound_current_source
  inputs:
    Kp: 2.0
    Ki: 0.5
    Kd: 0.1
    bias: 1.0
    residual_scale: 1.0
    error_lower_bound: -1000000000.0
    error_upper_bound: 1000000000.0
    error_initial_guess: 0.0
    error_scale: 1.0
    integral_error_lower_bound: -1000000000.0
    integral_error_upper_bound: 1000000000.0
    integral_error_initial_guess: 0.0
    integral_error_scale: 1.0
    derivative_error_lower_bound: -1000000000.0
    derivative_error_upper_bound: 1000000000.0
    derivative_error_initial_guess: 0.0
    derivative_error_scale: 1.0
    output_lower_bound: -1000000000.0
    output_upper_bound: 1000000000.0
    output_initial_guess: 0.0
    output_scale: 1.0
    error: 0.0
    integral_error: 0.0
    derivative_error: 0.0
    output: 0.0
  expected:
    pid_algebraic: -1.0
  tolerance: 1.0e-09
claim_boundary: This is an unlicensed source-first reconstruction for one exact maintained instantiation. It does not prove
  physical correctness, external FMI coverage, or arbitrary-target reconstruction until separate evidence accepts those claims.
