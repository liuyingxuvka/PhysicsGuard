schema: physicsguard.project_formula.v1
module_type: UnitConversionAuditModule
owner: physicsguard.module_semantics.source_first.UnitConversionAuditModule
purpose: Source-first reconstruction of the exact maintained implementation, configuration, scenario ports, state roles, residuals,
  and protected failure.
authoring_status: source_first_reconstruction_pending_independent_review
separate_review_status: pending
physical_claim_licensed: false
direction_scope: exact_instantiation_source_first_reconstruction
relation_directionality: direction_neutral
configuration:
- name: factor
  dimension: dimensionless
  unit: '1'
  required: true
  default: null
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''factor''), ''factor'')'
- name: offset
  dimension: dimensionless
  unit: '1'
  required: false
  default: 0.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''offset'', 0.0), ''offset'')'
- name: residual_scale
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1.0
  constraints:
  - 'Maintained source guard: positive_float(parameters.get(''residual_scale'', 1.0), ''residual_scale'')'
- name: source_unit
  dimension: enum
  unit: enum
  required: false
  default: null
  constraints:
  - 'Maintained source guard: parameters.get(''source_unit'')'
- name: source_value_initial_guess
  dimension: dimensionless
  unit: '1'
  required: false
  default: 0.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''source_value_initial_guess'', 0.0), ''source_value_initial_guess'')'
- name: source_value_lower_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: -1000000000.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''source_value_lower_bound'', -1000000000.0), ''source_value_lower_bound'')'
- name: source_value_scale
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1.0
  constraints:
  - 'Maintained source guard: positive_float(parameters.get(''source_value_scale'', 1.0), ''source_value_scale'')'
- name: source_value_upper_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1000000000.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''source_value_upper_bound'', 1000000000.0), ''source_value_upper_bound'')'
- name: target_unit
  dimension: enum
  unit: enum
  required: false
  default: null
  constraints:
  - 'Maintained source guard: parameters.get(''target_unit'')'
- name: target_value_initial_guess
  dimension: dimensionless
  unit: '1'
  required: false
  default: 0.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''target_value_initial_guess'', 0.0), ''target_value_initial_guess'')'
- name: target_value_lower_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: -1000000000.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''target_value_lower_bound'', -1000000000.0), ''target_value_lower_bound'')'
- name: target_value_scale
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1.0
  constraints:
  - 'Maintained source guard: positive_float(parameters.get(''target_value_scale'', 1.0), ''target_value_scale'')'
- name: target_value_upper_bound
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1000000000.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''target_value_upper_bound'', 1000000000.0), ''target_value_upper_bound'')'
scenario_inputs:
- name: source_value
  dimension: dimensionless
  unit: '1'
  role: input
scenario_outputs:
- name: target_value
  dimension: dimensionless
  unit: '1'
  role: output
residuals:
- name: unit_conversion_audit
  expression: target_value - (factor * source_value + offset)
  dimension: dimensionless
  unit: '1'
  dimensional_derivation: The exact maintained-source relation is normalized in 1; physical meaning remains pending separate
    review.
  scale_expression: residual_scale
  zero_condition: The exact source-first relation unit_conversion_audit evaluates to zero.
constraints:
  constructor:
  - predicate: residual_scale > 0
    guard_signature: positive_float(parameters.get('residual_scale', 1.0), 'residual_scale')
    failure_type: ValueError
    message_selector: residual_scale
    on_violation: Reject non-positive residual_scale through the maintained source guard.
    cases:
    - kind: inside
      inputs:
        residual_scale: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale: -1.0
      expected: fail
  evaluation: []
regions:
  valid:
  - predicate: residual_scale > 0
    meaning: The protected maintained constructor guard accepts this region.
    cases:
    - kind: inside
      inputs:
        residual_scale: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale: -1.0
      expected: fail
  invalid:
  - predicate: not (residual_scale > 0)
    meaning: The protected maintained constructor guard rejects this region.
    cases:
    - kind: inside
      inputs:
        residual_scale: -1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: pass
    - kind: outside
      inputs:
        residual_scale: 1.0
      expected: fail
assumptions:
- This reconstruction describes the exact bound current source and example only.
- No physical truth or cross-target generalization is licensed by source agreement.
validity:
- Use only while the bound implementation, exact instantiation, formula, ports, and tests retain matching fingerprints.
invariants:
- All maintained constructor parameters have explicit source provenance.
- Scenario ports exactly cover every current local declaration and referenced external variable.
effects:
- Read the exact bound scenario ports and emit 1 named residual record(s) without mutating the solver vector.
postconditions:
- Every emitted record keeps its source name, role, positive scale, diagnostic key, and source-bound arithmetic.
termination: Finite algebraic source-first evaluation terminates without retry or hidden iteration.
behavior_contract:
  kind: residual_equations
  residuals:
  - unit_conversion_audit
  input_ports:
  - source_value
  output_ports:
  - target_value
oracle_cases:
- case_id: exact_bound_current_source
  inputs:
    source_unit: bar
    target_unit: Pa
    factor: 100000.0
    offset: 0.0
    residual_scale: 1.0
    source_value_lower_bound: -1000000000.0
    source_value_upper_bound: 1000000000.0
    source_value_initial_guess: 0.0
    source_value_scale: 1.0
    target_value_lower_bound: -1000000000.0
    target_value_upper_bound: 1000000000.0
    target_value_initial_guess: 0.0
    target_value_scale: 1.0
    source_value: 0.0
    target_value: 0.0
  expected:
    unit_conversion_audit: 0.0
  tolerance: 1.0e-09
claim_boundary: This is an unlicensed source-first reconstruction for one exact maintained instantiation. It does not prove
  physical correctness, external FMI coverage, or arbitrary-target reconstruction until separate evidence accepts those claims.
