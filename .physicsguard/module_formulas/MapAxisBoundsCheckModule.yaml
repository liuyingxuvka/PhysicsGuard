schema: physicsguard.project_formula.v1
module_type: MapAxisBoundsCheckModule
owner: physicsguard.module_semantics.source_first.MapAxisBoundsCheckModule
purpose: Source-first reconstruction of the exact maintained implementation, configuration, scenario ports, state roles, residuals,
  and protected failure.
authoring_status: source_first_reconstruction_pending_independent_review
separate_review_status: pending
physical_claim_licensed: false
direction_scope: exact_instantiation_source_first_reconstruction
relation_directionality: direction_neutral
configuration:
- name: lower_bounds
  dimension: dimensionless
  unit: '1'
  required: false
  default: null
  constraints:
  - 'Maintained source guard: parameters.get(''lower_bounds'')'
- name: residual_scale
  dimension: dimensionless
  unit: '1'
  required: false
  default: 1.0
  constraints:
  - 'Maintained source guard: positive_float(parameters.get(''residual_scale'', 1.0), ''residual_scale'')'
- name: upper_bounds
  dimension: dimensionless
  unit: '1'
  required: false
  default: null
  constraints:
  - 'Maintained source guard: parameters.get(''upper_bounds'')'
- name: variables
  dimension: enum
  unit: enum
  required: false
  default: null
  constraints:
  - 'Maintained source guard: parameters.get(''variables'')'
scenario_inputs:
- name: observed_0
  dimension: dimensionless
  unit: '1'
  role: input
  source_kind: external
  source_attribute: variables
  source_reference: sig.x
  source_index: 0
scenario_outputs: []
residuals:
- name: map_axis_bounds:{variable}
  expression: observed_0 - upper_bounds[0] if observed_0 > upper_bounds[0] else observed_0 - lower_bounds[0] if observed_0
    < lower_bounds[0] else 0.0
  dimension: dimensionless
  unit: '1'
  dimensional_derivation: The exact maintained-source relation is normalized in 1; physical meaning remains pending separate
    review.
  scale_expression: residual_scale
  zero_condition: The exact source-first relation map_axis_bounds:{variable} evaluates to zero.
  runtime_name: map_axis_bounds:sig.x
constraints:
  constructor:
  - predicate: residual_scale > 0
    guard_signature: positive_float(parameters.get('residual_scale', 1.0), 'residual_scale')
    failure_type: ValueError
    message_selector: residual_scale
    on_violation: Reject non-positive residual_scale through the maintained source guard.
    cases:
    - kind: inside
      inputs:
        residual_scale: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale: -1.0
      expected: fail
  evaluation: []
regions:
  valid:
  - predicate: residual_scale > 0
    meaning: The protected maintained constructor guard accepts this region.
    cases:
    - kind: inside
      inputs:
        residual_scale: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale: -1.0
      expected: fail
  invalid:
  - predicate: not (residual_scale > 0)
    meaning: The protected maintained constructor guard rejects this region.
    cases:
    - kind: inside
      inputs:
        residual_scale: -1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale: 0.0
      expected: pass
    - kind: outside
      inputs:
        residual_scale: 1.0
      expected: fail
assumptions:
- This reconstruction describes the exact bound current source and example only.
- No physical truth or cross-target generalization is licensed by source agreement.
validity:
- Use only while the bound implementation, exact instantiation, formula, ports, and tests retain matching fingerprints.
invariants:
- All maintained constructor parameters have explicit source provenance.
- Scenario ports exactly cover every current local declaration and referenced external variable.
effects:
- Read the exact bound scenario ports and emit 1 named residual record(s) without mutating the solver vector.
postconditions:
- Every emitted record keeps its source name, role, positive scale, diagnostic key, and source-bound arithmetic.
termination: Finite algebraic source-first evaluation terminates without retry or hidden iteration.
behavior_contract:
  kind: residual_equations
  residuals:
  - map_axis_bounds:{variable}
  input_ports:
  - observed_0
  output_ports: []
oracle_cases:
- case_id: exact_bound_current_source
  inputs:
    variables:
    - sig.x
    lower_bounds:
    - 0.0
    upper_bounds:
    - 1.0
    residual_scale: 1.0
    observed_0: 1.0
  expected:
    map_axis_bounds:{variable}: 0.0
  tolerance: 1.0e-09
claim_boundary: This is an unlicensed source-first reconstruction for one exact maintained instantiation. It does not prove
  physical correctness, external FMI coverage, or arbitrary-target reconstruction until separate evidence accepts those claims.
