schema: physicsguard.project_formula.v1
module_type: TranslationalInertiaForceModule
owner: physicsguard.module_semantics.mechanical_draft.TranslationalInertiaForceModule
purpose: Mechanically describe the current lumped translational inertia force relation and exact scenario roles.
authoring_status: mechanical_draft_pending_independent_review
separate_review_status: pending
physical_claim_licensed: false
direction_scope: exact_instantiation_mechanical_draft
relation_directionality: direction_neutral
configuration:
  - {name: mass_kg, dimension: mass, unit: kg, required: true, default: null, constraints: [mass_kg > 0]}
  - {name: residual_scale_N, dimension: force, unit: N, required: false, default: 1.0, constraints: [residual_scale_N > 0]}
scenario_inputs:
  - {name: acceleration_m_s2, dimension: acceleration, unit: m/s^2}
scenario_outputs:
  - {name: force_N, dimension: force, unit: N}
residuals:
  - name: translational_inertia_force
    expression: force_N - mass_kg * acceleration_m_s2
    dimension: force
    unit: N
    dimensional_derivation: Kilograms times metres per second squared yields newtons.
    scale_expression: residual_scale_N
    zero_condition: Force equals mass times acceleration under the current sign convention.
    source_intermediates:
      - {symbol: acceleration, expression: acceleration_m_s2}
      - {symbol: force, expression: force_N}
constraints:
  constructor:
    - {predicate: mass_kg > 0, guard_signature: "required_positive(parameters, 'mass_kg')", failure_type: ValueError, message_selector: mass_kg, on_violation: Reject missing or non-positive mass., cases: [{kind: inside, inputs: {mass_kg: 10.0}, expected: pass}, {kind: boundary, inputs: {mass_kg: 0.0}, expected: fail}, {kind: outside, inputs: {mass_kg: -1.0}, expected: fail}]}
    - {predicate: residual_scale_N > 0, guard_signature: "positive_float(parameters.get('residual_scale_N', 1.0), 'residual_scale_N')", failure_type: ValueError, message_selector: residual_scale_N, on_violation: Reject non-positive force normalization., cases: [{kind: inside, inputs: {residual_scale_N: 1.0}, expected: pass}, {kind: boundary, inputs: {residual_scale_N: 0.0}, expected: fail}, {kind: outside, inputs: {residual_scale_N: -1.0}, expected: fail}]}
  evaluation: []
regions:
  valid:
    - {predicate: "mass_kg > 0 and residual_scale_N > 0", meaning: Positive lumped mass and force normalization., cases: [{kind: inside, inputs: {mass_kg: 10.0, residual_scale_N: 1.0}, expected: pass}, {kind: boundary, inputs: {mass_kg: 0.0, residual_scale_N: 1.0}, expected: fail}, {kind: outside, inputs: {mass_kg: -1.0, residual_scale_N: 1.0}, expected: fail}]}
  invalid:
    - {predicate: "mass_kg <= 0 or residual_scale_N <= 0", meaning: Invalid mass or force normalization., cases: [{kind: inside, inputs: {mass_kg: -1.0, residual_scale_N: 1.0}, expected: pass}, {kind: boundary, inputs: {mass_kg: 0.0, residual_scale_N: 1.0}, expected: pass}, {kind: outside, inputs: {mass_kg: 10.0, residual_scale_N: 1.0}, expected: fail}]}
assumptions: [Lumped mass, No friction constraints or rotational coupling, Current force and acceleration sign convention is shared]
validity: [Use only for the exact current low-fidelity relation]
invariants: [Acceleration is read-only and force is checked without mutation]
effects: [Emit one translational_inertia_force residual]
postconditions: [Residual equals force minus mass times acceleration]
termination: One multiplication and subtraction terminate.
oracle_cases:
  - {case_id: balanced, inputs: {mass_kg: 10.0, acceleration_m_s2: 2.0, force_N: 20.0, residual_scale_N: 1.0}, expected: {translational_inertia_force: 0.0}, tolerance: 1.0e-12}
  - {case_id: force_offset, inputs: {mass_kg: 10.0, acceleration_m_s2: 2.0, force_N: 18.0, residual_scale_N: 1.0}, expected: {translational_inertia_force: -2.0}, tolerance: 1.0e-12}
claim_boundary: This current lumped arithmetic draft does not validate mass data, constraints, coupling, sign convention, or physical correctness.
