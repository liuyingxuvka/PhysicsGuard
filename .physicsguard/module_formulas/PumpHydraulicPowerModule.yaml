scenario_inputs:
- name: p_out_Pa
  dimension: pressure
  unit: Pa
  role: input
- name: p_in_Pa
  dimension: pressure
  unit: Pa
  role: input
- name: m_dot_kg_s
  dimension: mass_flow
  unit: kg/s
  role: input
scenario_outputs:
- name: P_shaft_W
  dimension: power
  unit: W
  role: output
residuals:
- name: pump_hydraulic_power
  expression: P_shaft_W - (p_out_Pa - p_in_Pa) * m_dot_kg_s / rho_kg_m3 / efficiency
  dimension: power
  unit: W
  dimensional_derivation: The exact maintained-source relation is normalized in W; physical meaning remains pending separate
    review.
  scale_expression: residual_scale_W
  zero_condition: The exact source-first relation pump_hydraulic_power evaluates to zero.
constraints:
  constructor:
  - predicate: residual_scale_W > 0
    guard_signature: _positive_float(parameters.get('residual_scale_W', 1000.0), 'residual_scale_W')
    failure_type: ValueError
    message_selector: residual_scale_W
    on_violation: Reject non-positive residual_scale_W through the maintained source guard.
    cases:
    - kind: inside
      inputs:
        residual_scale_W: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale_W: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale_W: -1.0
      expected: fail
  evaluation: []
regions:
  valid:
  - predicate: residual_scale_W > 0
    meaning: The protected maintained constructor guard accepts this region.
    cases:
    - kind: inside
      inputs:
        residual_scale_W: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale_W: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale_W: -1.0
      expected: fail
  invalid:
  - predicate: not (residual_scale_W > 0)
    meaning: The protected maintained constructor guard rejects this region.
    cases:
    - kind: inside
      inputs:
        residual_scale_W: -1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale_W: 0.0
      expected: pass
    - kind: outside
      inputs:
        residual_scale_W: 1.0
      expected: fail
