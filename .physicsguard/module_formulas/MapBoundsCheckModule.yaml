schema: physicsguard.project_formula.v1
module_type: MapBoundsCheckModule
owner: physicsguard.module_semantics.mechanical_draft.MapBoundsCheckModule
purpose: Mechanically describe the exact map-axis bounds post-check over one externally referenced unitless signal.
authoring_status: mechanical_draft_pending_independent_review
separate_review_status: pending
physical_claim_licensed: false
direction_scope: exact_instantiation_mechanical_draft
relation_directionality: direction_neutral
configuration:
  - {name: lower, dimension: dimensionless, unit: '1', required: true, default: null, constraints: [lower < upper]}
  - {name: upper, dimension: dimensionless, unit: '1', required: true, default: null, constraints: [upper > lower]}
  - {name: residual_scale, dimension: dimensionless, unit: '1', required: false, default: 1.0, constraints: [residual_scale > 0]}
scenario_inputs:
  - {name: value, dimension: dimensionless, unit: '1', source_kind: external, source_attribute: variable, source_reference: signal.x}
scenario_outputs: []
residuals:
  - name: map_bounds_check
    expression: value - upper if value > upper else (value - lower if value < lower else 0.0)
    dimension: dimensionless
    unit: '1'
    dimensional_derivation: Value and both exact map bounds are unitless.
    scale_expression: residual_scale
    zero_condition: The residual is zero exactly inside the inclusive lower and upper bounds.
    source_intermediates:
      - {symbol: residual, expression: "value - upper if value > upper else (value - lower if value < lower else 0.0)"}
constraints:
  constructor:
    - {predicate: lower < upper, guard_signature: "if self.lower >= self.upper", failure_type: ValueError, message_selector: lower, on_violation: Reject an empty or reversed bounds interval., cases: [{kind: inside, inputs: {lower: 0.0, upper: 1.0}, expected: pass}, {kind: boundary, inputs: {lower: 1.0, upper: 1.0}, expected: fail}, {kind: outside, inputs: {lower: 2.0, upper: 1.0}, expected: fail}]}
    - {predicate: residual_scale > 0, guard_signature: "_positive_float(parameters.get('residual_scale', 1.0), 'residual_scale')", failure_type: ValueError, message_selector: residual_scale, on_violation: Reject a non-positive residual scale., cases: [{kind: inside, inputs: {residual_scale: 1.0}, expected: pass}, {kind: boundary, inputs: {residual_scale: 0.0}, expected: fail}, {kind: outside, inputs: {residual_scale: -1.0}, expected: fail}]}
  evaluation: []
regions:
  valid:
    - {predicate: "lower < upper and value >= lower and value <= upper and residual_scale > 0", meaning: Signal lies inside the exact map interval with usable normalization., cases: [{kind: inside, inputs: {lower: 0.0, upper: 1.0, value: 0.5, residual_scale: 1.0}, expected: pass}, {kind: boundary, inputs: {lower: 0.0, upper: 1.0, value: 1.0, residual_scale: 1.0}, expected: pass}, {kind: outside, inputs: {lower: 0.0, upper: 1.0, value: 2.0, residual_scale: 1.0}, expected: fail}]}
  invalid:
    - {predicate: "lower >= upper or value < lower or value > upper or residual_scale <= 0", meaning: Invalid interval, out-of-range signal, or normalization., cases: [{kind: inside, inputs: {lower: 0.0, upper: 1.0, value: 2.0, residual_scale: 1.0}, expected: pass}, {kind: boundary, inputs: {lower: 0.0, upper: 1.0, value: 1.0, residual_scale: 1.0}, expected: fail}, {kind: outside, inputs: {lower: 0.0, upper: 1.0, value: 0.5, residual_scale: 1.0}, expected: fail}]}
assumptions: [The qualified signal reference resolves in the exact example, This post-check does not interpolate a map]
validity: [Use only for the exact current unitless map-axis example]
invariants: [The external signal is read-only and no solver variable is produced]
effects: [Emit one post_check residual]
postconditions: [Residual sign identifies the side of the violated interval and is zero inside]
termination: A finite two-branch comparison terminates.
oracle_cases:
  - {case_id: inside, inputs: {value: 0.5, lower: 0.0, upper: 1.0, residual_scale: 1.0}, expected: {map_bounds_check: 0.0}, tolerance: 1.0e-12}
  - {case_id: above, inputs: {value: 1.25, lower: 0.0, upper: 1.0, residual_scale: 1.0}, expected: {map_bounds_check: 0.25}, tolerance: 1.0e-12}
claim_boundary: This draft binds the current unitless example and source branches only; it does not validate a map, interpolation method, or physical range.
