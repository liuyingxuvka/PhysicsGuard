schema: physicsguard.project_formula.v1
module_type: PipeSegmentSimpleModule
owner: physicsguard.module_semantics.source_first.PipeSegmentSimpleModule
purpose: Source-first reconstruction of the exact maintained implementation, configuration, scenario ports, state roles, residuals,
  and protected failure.
authoring_status: source_first_reconstruction_pending_independent_review
separate_review_status: pending
physical_claim_licensed: false
direction_scope: exact_instantiation_source_first_reconstruction
relation_directionality: direction_neutral
configuration:
- name: K_minor
  dimension: dimensionless
  unit: '1'
  required: false
  default: 0.0
  constraints:
  - 'Maintained source guard: nonnegative_float(parameters.get(''K_minor'', 0.0), ''K_minor'')'
- name: diameter_m
  dimension: length
  unit: m
  required: true
  default: null
  constraints:
  - 'Maintained source guard: required_positive(parameters, ''diameter_m'')'
- name: friction_factor
  dimension: dimensionless
  unit: '1'
  required: false
  default: 0.02
  constraints:
  - 'Maintained source guard: nonnegative_float(parameters.get(''friction_factor'', 0.02), ''friction_factor'')'
- name: length_m
  dimension: length
  unit: m
  required: true
  default: null
  constraints:
  - 'Maintained source guard: required_nonnegative(parameters, ''length_m'')'
- name: m_dot_initial_guess
  dimension: mass_flow
  unit: kg/s
  required: false
  default: 0.1
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''m_dot_initial_guess'', 0.1), ''m_dot_initial_guess'')'
- name: m_dot_lower_bound
  dimension: mass_flow
  unit: kg/s
  required: false
  default: -10000.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''m_dot_lower_bound'', -10000.0), ''m_dot_lower_bound'')'
- name: m_dot_scale
  dimension: mass_flow
  unit: kg/s
  required: false
  default: 1.0
  constraints:
  - 'Maintained source guard: positive_float(parameters.get(''m_dot_scale'', 1.0), ''m_dot_scale'')'
- name: m_dot_upper_bound
  dimension: mass_flow
  unit: kg/s
  required: false
  default: 10000.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''m_dot_upper_bound'', 10000.0), ''m_dot_upper_bound'')'
- name: p_in_initial_guess
  dimension: pressure
  unit: Pa
  required: false
  default: 120000.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''p_in_initial_guess'', 120000.0), ''p_in_initial_guess'')'
- name: p_in_lower_bound
  dimension: pressure
  unit: Pa
  required: false
  default: 1000.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''p_in_lower_bound'', 1000.0), ''p_in_lower_bound'')'
- name: p_in_scale
  dimension: pressure
  unit: Pa
  required: false
  default: 100000.0
  constraints:
  - 'Maintained source guard: positive_float(parameters.get(''p_in_scale'', 100000.0), ''p_in_scale'')'
- name: p_in_upper_bound
  dimension: pressure
  unit: Pa
  required: false
  default: 100000000.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''p_in_upper_bound'', 100000000.0), ''p_in_upper_bound'')'
- name: p_out_initial_guess
  dimension: pressure
  unit: Pa
  required: false
  default: 100000.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''p_out_initial_guess'', 100000.0), ''p_out_initial_guess'')'
- name: p_out_lower_bound
  dimension: pressure
  unit: Pa
  required: false
  default: 1000.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''p_out_lower_bound'', 1000.0), ''p_out_lower_bound'')'
- name: p_out_scale
  dimension: pressure
  unit: Pa
  required: false
  default: 100000.0
  constraints:
  - 'Maintained source guard: positive_float(parameters.get(''p_out_scale'', 100000.0), ''p_out_scale'')'
- name: p_out_upper_bound
  dimension: pressure
  unit: Pa
  required: false
  default: 100000000.0
  constraints:
  - 'Maintained source guard: finite_float(parameters.get(''p_out_upper_bound'', 100000000.0), ''p_out_upper_bound'')'
- name: residual_scale_Pa
  dimension: pressure
  unit: Pa
  required: false
  default: 1000.0
  constraints:
  - 'Maintained source guard: positive_float(parameters.get(''residual_scale_Pa'', 1000.0), ''residual_scale_Pa'')'
- name: rho_kg_m3
  dimension: density
  unit: kg/m^3
  required: true
  default: null
  constraints:
  - 'Maintained source guard: required_positive(parameters, ''rho_kg_m3'')'
scenario_inputs:
- name: p_out_Pa
  dimension: pressure
  unit: Pa
  role: input
- name: m_dot_kg_s
  dimension: mass_flow
  unit: kg/s
  role: input
scenario_outputs:
- name: p_in_Pa
  dimension: pressure
  unit: Pa
  role: output
residuals:
- name: pipe_segment_pressure_drop
  expression: p_in_Pa - p_out_Pa - (friction_factor * length_m / diameter_m + K_minor) * 0.5 * rho_kg_m3 * (m_dot_kg_s / (rho_kg_m3
    * (pi * diameter_m ** 2 / 4.0))) * abs(m_dot_kg_s / (rho_kg_m3 * (pi * diameter_m ** 2 / 4.0)))
  dimension: pressure
  unit: Pa
  dimensional_derivation: The exact maintained-source relation is normalized in Pa; physical meaning remains pending separate
    review.
  scale_expression: residual_scale_Pa
  zero_condition: The exact source-first relation pipe_segment_pressure_drop evaluates to zero.
constraints:
  constructor:
  - predicate: residual_scale_Pa > 0
    guard_signature: positive_float(parameters.get('residual_scale_Pa', 1000.0), 'residual_scale_Pa')
    failure_type: ValueError
    message_selector: residual_scale_Pa
    on_violation: Reject non-positive residual_scale_Pa through the maintained source guard.
    cases:
    - kind: inside
      inputs:
        residual_scale_Pa: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale_Pa: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale_Pa: -1.0
      expected: fail
  evaluation: []
regions:
  valid:
  - predicate: residual_scale_Pa > 0
    meaning: The protected maintained constructor guard accepts this region.
    cases:
    - kind: inside
      inputs:
        residual_scale_Pa: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale_Pa: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale_Pa: -1.0
      expected: fail
  invalid:
  - predicate: not (residual_scale_Pa > 0)
    meaning: The protected maintained constructor guard rejects this region.
    cases:
    - kind: inside
      inputs:
        residual_scale_Pa: -1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale_Pa: 0.0
      expected: pass
    - kind: outside
      inputs:
        residual_scale_Pa: 1.0
      expected: fail
assumptions:
- This reconstruction describes the exact bound current source and example only.
- No physical truth or cross-target generalization is licensed by source agreement.
validity:
- Use only while the bound implementation, exact instantiation, formula, ports, and tests retain matching fingerprints.
invariants:
- All maintained constructor parameters have explicit source provenance.
- Scenario ports exactly cover every current local declaration and referenced external variable.
effects:
- Read the exact bound scenario ports and emit 1 named residual record(s) without mutating the solver vector.
postconditions:
- Every emitted record keeps its source name, role, positive scale, diagnostic key, and source-bound arithmetic.
termination: Finite algebraic source-first evaluation terminates without retry or hidden iteration.
behavior_contract:
  kind: residual_equations
  residuals:
  - pipe_segment_pressure_drop
  input_ports:
  - p_out_Pa
  - m_dot_kg_s
  output_ports:
  - p_in_Pa
oracle_cases:
- case_id: exact_bound_current_source
  inputs:
    rho_kg_m3: 1000.0
    diameter_m: 0.1
    length_m: 10.0
    friction_factor: 0.02
    K_minor: 1.0
    residual_scale_Pa: 1000.0
    p_in_lower_bound: 1000.0
    p_in_upper_bound: 100000000.0
    p_in_initial_guess: 120000.0
    p_in_scale: 100000.0
    p_out_lower_bound: 1000.0
    p_out_upper_bound: 100000000.0
    p_out_initial_guess: 100000.0
    p_out_scale: 100000.0
    m_dot_lower_bound: -10000.0
    m_dot_upper_bound: 10000.0
    m_dot_initial_guess: 0.1
    m_dot_scale: 1.0
    p_out_Pa: 100000.0
    m_dot_kg_s: 0.1
    p_in_Pa: 120000.0
  expected:
    pipe_segment_pressure_drop: 19999.756829159258
  tolerance: 1.0e-09
claim_boundary: This is an unlicensed source-first reconstruction for one exact maintained instantiation. It does not prove
  physical correctness, external FMI coverage, or arbitrary-target reconstruction until separate evidence accepts those claims.
