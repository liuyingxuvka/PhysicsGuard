schema: physicsguard.project_formula.v1
module_type: IncompressibleOrificeModule
owner: physicsguard.module_semantics.source_first.IncompressibleOrificeModule
purpose: Source-first reconstruction of the exact maintained implementation, configuration, scenario ports, state roles, residuals,
  and protected failure.
authoring_status: source_first_reconstruction_pending_independent_review
separate_review_status: pending
physical_claim_licensed: false
direction_scope: exact_instantiation_source_first_reconstruction
relation_directionality: direction_neutral
configuration:
- name: CdA_m2
  dimension: area
  unit: m^2
  required: true
  default: null
  constraints:
  - 'Maintained source guard: _required_positive(parameters, ''CdA_m2'')'
- name: m_dot_initial_guess
  dimension: mass_flow
  unit: kg/s
  required: false
  default: 0.1
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(''m_dot_initial_guess'', 0.1), ''m_dot_initial_guess'')'
- name: m_dot_lower_bound
  dimension: mass_flow
  unit: kg/s
  required: false
  default: 0.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(''m_dot_lower_bound'', 0.0), ''m_dot_lower_bound'')'
- name: m_dot_scale
  dimension: mass_flow
  unit: kg/s
  required: false
  default: 1.0
  constraints:
  - 'Maintained source guard: _positive_float(parameters.get(''m_dot_scale'', 1.0), ''m_dot_scale'')'
- name: m_dot_upper_bound
  dimension: mass_flow
  unit: kg/s
  required: false
  default: 10.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(''m_dot_upper_bound'', 10.0), ''m_dot_upper_bound'')'
- name: p_downstream_initial_guess
  dimension: pressure
  unit: Pa
  required: false
  default: 100000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(''p_downstream_initial_guess'', 100000.0), ''p_downstream_initial_guess'')'
- name: p_lower_bound
  dimension: pressure
  unit: Pa
  required: false
  default: 1000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(''p_lower_bound'', 1000.0), ''p_lower_bound'')'
- name: p_scale
  dimension: pressure
  unit: Pa
  required: false
  default: 100000.0
  constraints:
  - 'Maintained source guard: _positive_float(parameters.get(''p_scale'', 100000.0), ''p_scale'')'
- name: p_upper_bound
  dimension: pressure
  unit: Pa
  required: false
  default: 10000000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(''p_upper_bound'', 10000000.0), ''p_upper_bound'')'
- name: p_upstream_initial_guess
  dimension: pressure
  unit: Pa
  required: false
  default: 120000.0
  constraints:
  - 'Maintained source guard: _finite_float(parameters.get(''p_upstream_initial_guess'', 120000.0), ''p_upstream_initial_guess'')'
- name: residual_scale_kg2_s2
  dimension: squared_mass_flow
  unit: kg^2/s^2
  required: false
  default: 0.0001
  constraints:
  - 'Maintained source guard: _positive_float(parameters.get(''residual_scale_kg2_s2'', 0.0001), ''residual_scale_kg2_s2'')'
- name: rho_kg_m3
  dimension: density
  unit: kg/m^3
  required: true
  default: null
  constraints:
  - 'Maintained source guard: _required_positive(parameters, ''rho_kg_m3'')'
scenario_inputs:
- name: p_upstream_Pa
  dimension: pressure
  unit: Pa
  role: input
- name: p_downstream_Pa
  dimension: pressure
  unit: Pa
  role: input
scenario_outputs:
- name: m_dot_kg_s
  dimension: mass_flow
  unit: kg/s
  role: output
residuals:
- name: incompressible_orifice
  expression: m_dot_kg_s ** 2 - 2.0 * rho_kg_m3 * CdA_m2 ** 2 * (p_upstream_Pa - p_downstream_Pa)
  dimension: squared_mass_flow
  unit: kg^2/s^2
  dimensional_derivation: The exact maintained-source relation is normalized in kg^2/s^2; physical meaning remains pending
    separate review.
  scale_expression: residual_scale_kg2_s2
  zero_condition: The exact source-first relation incompressible_orifice evaluates to zero.
constraints:
  constructor:
  - predicate: residual_scale_kg2_s2 > 0
    guard_signature: _positive_float(parameters.get('residual_scale_kg2_s2', 0.0001), 'residual_scale_kg2_s2')
    failure_type: ValueError
    message_selector: residual_scale_kg2_s2
    on_violation: Reject non-positive residual_scale_kg2_s2 through the maintained source guard.
    cases:
    - kind: inside
      inputs:
        residual_scale_kg2_s2: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale_kg2_s2: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale_kg2_s2: -1.0
      expected: fail
  evaluation: []
regions:
  valid:
  - predicate: residual_scale_kg2_s2 > 0
    meaning: The protected maintained constructor guard accepts this region.
    cases:
    - kind: inside
      inputs:
        residual_scale_kg2_s2: 1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale_kg2_s2: 0.0
      expected: fail
    - kind: outside
      inputs:
        residual_scale_kg2_s2: -1.0
      expected: fail
  invalid:
  - predicate: not (residual_scale_kg2_s2 > 0)
    meaning: The protected maintained constructor guard rejects this region.
    cases:
    - kind: inside
      inputs:
        residual_scale_kg2_s2: -1.0
      expected: pass
    - kind: boundary
      inputs:
        residual_scale_kg2_s2: 0.0
      expected: pass
    - kind: outside
      inputs:
        residual_scale_kg2_s2: 1.0
      expected: fail
assumptions:
- This reconstruction describes the exact bound current source and example only.
- No physical truth or cross-target generalization is licensed by source agreement.
validity:
- Use only while the bound implementation, exact instantiation, formula, ports, and tests retain matching fingerprints.
invariants:
- All maintained constructor parameters have explicit source provenance.
- Scenario ports exactly cover every current local declaration and referenced external variable.
effects:
- Read the exact bound scenario ports and emit 1 named residual record(s) without mutating the solver vector.
postconditions:
- Every emitted record keeps its source name, role, positive scale, diagnostic key, and source-bound arithmetic.
termination: Finite algebraic source-first evaluation terminates without retry or hidden iteration.
behavior_contract:
  kind: residual_equations
  residuals:
  - incompressible_orifice
  input_ports:
  - p_upstream_Pa
  - p_downstream_Pa
  output_ports:
  - m_dot_kg_s
oracle_cases:
- case_id: exact_bound_current_source
  inputs:
    CdA_m2: 0.001
    rho_kg_m3: 1000.0
    residual_scale_kg2_s2: 0.1
    p_lower_bound: 1000.0
    p_upper_bound: 10000000.0
    p_upstream_initial_guess: 120000.0
    p_scale: 100000.0
    p_downstream_initial_guess: 100000.0
    m_dot_lower_bound: 0.0
    m_dot_upper_bound: 10.0
    m_dot_initial_guess: 3.16227766
    m_dot_scale: 1.0
    p_upstream_Pa: 120000.0
    p_downstream_Pa: 100000.0
    m_dot_kg_s: 3.16227766
  expected:
    incompressible_orifice: -30.000000001064926
  tolerance: 1.0e-09
claim_boundary: This is an unlicensed source-first reconstruction for one exact maintained instantiation. It does not prove
  physical correctness, external FMI coverage, or arbitrary-target reconstruction until separate evidence accepts those claims.
