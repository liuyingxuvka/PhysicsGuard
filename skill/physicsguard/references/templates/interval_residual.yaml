# PhysicsGuard interval residual
# Purpose: Check one residual whose observed value is only known as an interval.
# Repository: https://github.com/liuyingxuvka/PhysicsGuard
# Use with: python -m physicsguard.cli task-model interval-residual interval_residual.yaml
# Boundary: Reports robust_pass, robust_fail, indeterminate or not_run; never an ordinary audit pass.
residual_id: example_residual
observed:
  lower: -0.2
  upper: 0.4
acceptable:
  lower: -1.0
  upper: 1.0
source_ref: "where the observed interval comes from"
