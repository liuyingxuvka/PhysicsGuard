# PhysicsGuard task-local observation
# Purpose: Record the observation acquired after the plan was frozen.
# Repository: https://github.com/liuyingxuvka/PhysicsGuard
# Use with: python -m physicsguard.cli task-model observe hypothesis_plan.yaml diagnostic_observation.yaml
# Boundary: observation_sequence must be larger than the plan's prediction_sequence; missing targets stay undetermined.
observation_id: example_observation
task_id: example_task
plan_id: example_plan
selected_candidate_id: speed_trend
observation_sequence: 2
evidence:
  evidence_id: example_export
  producer_id: "the tool or person that produced the data"
  source_ref: "file, run or log the observation comes from"
  independence_group: example_run
  evidence_kind: observation
signals:
  speed: {trend: increase}
residuals: {}
timings: {}
external_input_ids: []
