# PhysicsGuard observed snapshot
# Purpose: Supply independent voltage, current and power measurements for audit_model.yaml.
# Repository: https://github.com/liuyingxuvka/PhysicsGuard
# Use with: python -m physicsguard.cli hierarchy evaluate audit_model.yaml observed_snapshot.yaml
# Boundary: One measured SI snapshot; not a time-series or external-tool equivalence claim.
observation_name: measured_dc_power_nominal
source_model:
  model_name: example_external_model
  tool: user-provided export
variables:
  power.V_V:
    value: 24.0
    unit: V
    source: example voltage measurement
    external_signal: bench/voltage
    mapping_confidence: high
    mapping_status: clean
  power.current_A:
    value: 2.0
    unit: A
    source: example current measurement
    external_signal: bench/current
    mapping_confidence: high
    mapping_status: clean
  power.P_W:
    value: 48.0
    unit: W
    source: example power measurement
    external_signal: bench/power
    mapping_confidence: high
    mapping_status: clean
