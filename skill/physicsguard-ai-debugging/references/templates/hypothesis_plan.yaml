# PhysicsGuard task-local hypothesis plan
# Purpose: Keep competing explanations alive and pick the observation that best separates them.
# Repository: https://github.com/liuyingxuvka/PhysicsGuard
# Use with: python -m physicsguard.cli task-model plan hypothesis_plan.yaml
# Boundary: Task-local; replace AUDIT.yaml with the hierarchy YAML the hypotheses are about (until then the plan is blocked).
plan_id: example_plan
task_id: example_task
purpose: "localize the suspicious block named by hierarchy evaluate"
non_trivial: true
model:
  model_id: example_hierarchy
  model_version: v1
  path: AUDIT.yaml
assumptions: []
unknowns: ["true physical cause"]
prediction_sequence: 1
hypotheses:
  - hypothesis_id: gain
    explanation: "feedback gain is too high"
    expectations:
      - expectation_id: gain_speed
        kind: signal
        target_id: speed
        operator: increase
        weakening_condition: "speed does not increase"
  - hypothesis_id: mapping
    explanation: "speed signal mapping is reversed"
    expectations:
      - expectation_id: mapping_speed
        kind: signal
        target_id: speed
        operator: decrease
        weakening_condition: "speed does not decrease"
observation_candidates:
  - candidate_id: speed_trend
    target_id: speed
    residual_relevance: 0.6
    predicted_outcomes: {gain: up, mapping: down}
  - candidate_id: temperature
    target_id: temperature
    residual_relevance: 0.8
    predicted_outcomes: {gain: up, mapping: up}
iteration: 0
max_iterations: 3
