contract_id: hpu2_cooler_run
data_file: oil_log.csv
manifest: oil_manifest.yaml
model: audit_oilcooler.yaml
time_column: t_s
properties:
  oil_density: {value: 0.87, unit: kg/L, source: question_oilcooler.txt}
fields:
  t_s: {unit: s, role: ignored, reason: Series clock}
  oil_flow_LPM: {unit: L/min, role: measured, target: oil.m_dot_kg_s, conversion_property: oil_density, confidence: high, evidence: Oil flow meter}
  T_oil_in_degF: {unit: degF, role: measured, target: oil.T_in_K, confidence: high, evidence: Cooler inlet thermometer}
  T_oil_out_degF: {unit: degF, role: measured, target: oil.T_out_K, confidence: high, evidence: Cooler outlet thermometer}
  fan_rpm: {unit: rpm, role: ignored, reason: Cooler fan speed is not in the model}
