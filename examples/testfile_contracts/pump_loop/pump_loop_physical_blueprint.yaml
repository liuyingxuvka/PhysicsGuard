  - boundary_id: validity.root
    owner_element_id: pump_loop_fixture
    statement: Three maintained samples from 0.0 s through 0.2 s; commanded speed 10 to 11 rad/s; fixture relation only.
    parameter_bounds: {commanded_speed: [0.0, 100.0], flow_readback: [0.0, 300.0]}
  - {boundary_id: validity.path, owner_element_id: fixture_validation_path, statement: Same maintained three-sample fixture and no between-sample dynamic claim.}
  - {boundary_id: validity.signal, owner_element_id: pump_signal_relation, statement: Pointwise y = 2*x relation within the declared command and output envelopes.}
  - {boundary_id: validity.mode, owner_element_id: valve_mode_context, statement: Boolean valve_open context at the three declared timestamps only.}
