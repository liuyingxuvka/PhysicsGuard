    value: 50000.0
    unit: W
    source: synthetic native hierarchy reference solution, not real bench data
    description: Reacted hydrogen consumption meter (inlet minus recovered unused
      hydrogen) converted using the explicitly declared LHV-equivalent basis; not
      total inlet feed energy.
    external_signal: bench/fuel_cell/h2_power/x
    mapping_confidence: proposed
    mapping_status: review_required
    review_required: true
    conversion_note: Already SI. Any meter-derived thermal/power/humidity conversion
      must be documented at the declared boundary.
    stale_when:
    - Meter boundary, calibration, fuel energy basis, control setting or channel convention
      changes.
