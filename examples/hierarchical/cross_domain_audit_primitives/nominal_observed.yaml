# PhysicsGuard observed-values snapshot
# Purpose: Authored nominal supplied signals only; coarse aliases remain derived, not additional measurements.
# Repository: https://github.com/liuyingxuvka/PhysicsGuard
# Use with: pair with an audit YAML via python -m physicsguard.cli hierarchy evaluate
# Boundary: Low-fidelity SI-unit residual audit only; not a high-fidelity solver, commercial-tool adapter, or reverse-engineered model.
observation_name: cross_domain_audit_primitives_nominal
description: Authored nominal supplied signals only; coarse aliases remain derived,
  not additional measurements.
variables:
  temperature_c_to_k.x:
    value: 25.0
    source: "tree.yaml#system.boundaries[0]"
    unit: degC
    external_signal: "boundary:temperature_c_to_k.x"
  temperature_c_to_k.y:
    value: 298.15
    source: "tree.yaml#system.boundaries[1]"
    unit: K
    external_signal: "boundary:temperature_c_to_k.y"
  pressure_sensor_scale.true_value:
    value: 200000.0
    source: "tree.yaml#system.boundaries[2]"
    unit: "Pa"
    external_signal: "boundary:pressure_sensor_scale.true_value"
  pressure_sensor_scale.measured_value:
    value: 200000.0
    source: "tree.yaml#system.boundaries[3]"
    unit: "Pa"
    external_signal: "boundary:pressure_sensor_scale.measured_value"
  metered_source_power.value:
    value: 100000.0
    source: "tree.yaml#system.boundaries[4]"
    unit: W
    external_signal: mapped_metered_source_power
  metered_load_power.value:
    value: 80000.0
    source: "tree.yaml#system.boundaries[5]"
    unit: W
    external_signal: mapped_metered_load_power
  unmetered_loss_power.value:
    value: 20000.0
    source: "tree.yaml#system.boundaries[6]"
    unit: W
    external_signal: mapped_unmetered_loss_power
  sample_delay.value:
    value: 0.2
    source: "tree.yaml#system.boundaries[7]"
    unit: s
    external_signal: mapped_sample_delay
