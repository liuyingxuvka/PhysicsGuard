  system_name: stormwater_sewer_drainage_level_1_catchment_conveyance_storage_pump
  components:
  - id: coarse_rainfall_runoff_mass_flow
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: kg/s
      lower_bound: 0.0
      upper_bound: 1000000000.0
      initial_guess: 200.0
      scale: 100.0
      external_signal: mapped_rainfall_runoff_mass_flow
      mapping_confidence: template
  - id: coarse_sanitary_base_mass_flow
