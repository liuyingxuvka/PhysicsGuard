# PhysicsGuard hierarchical audit model
# Purpose: One connected coarse-to-fine audit tree. Gross catchment plus sewer inflow is 280 kg/s, not conveyance inflow 240. Global storage is catchment...
# Repository: https://github.com/liuyingxuvka/PhysicsGuard
# Use with: python -m physicsguard.cli hierarchy run examples/hierarchical/stormwater_sewer_drainage/tree.yaml --pretty
# Boundary: Low-fidelity SI-unit residual audit only; not a high-fidelity solver, commercial-tool adapter, or reverse-engineered model.
audit_name: stormwater_sewer_drainage
description: One connected coarse-to-fine audit tree. Gross catchment plus sewer inflow
  is 280 kg/s, not conveyance inflow 240. Global storage is catchment surface 40 plus
  sewer 0. Detention 60=50+5+5 has its own scoped balance and does not add 5 to the
  gross-network storage.
