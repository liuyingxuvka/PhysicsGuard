    - wet_well_level_basis
    rationale: Pump-station residual is high; inspect meter grouping, hydraulic-power
      estimate, wet-well fill, and run status before adding pump curves.
    priority: 10
  - id: refine_pollutant_load
    block_id: pollutant_load
    trigger_diagnostic_keys:
    - aggregate_mass_balance_mismatch
    score_threshold: 1.0
    next_template_ids: []
    next_required_variables:
