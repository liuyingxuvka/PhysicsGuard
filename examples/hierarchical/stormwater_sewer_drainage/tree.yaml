    - pollutant.treated_discharge_load_kg_s
    - pollutant.overflow_load_kg_s
    - pollutant.removed_load_kg_s
    next_required_parameters:
    - pollutant_load_basis
    - concentration_flow_pairing
    rationale: Pollutant-load residual is high; inspect load mapping and concentration-flow
      pairing before adding water-quality process logic.
    priority: 5
  scoring:
    method: max
metadata:
  template_level: 1
  domain: stormwater_sewer_drainage
  assumptions:
  - This template checks steady snapshot accounting only and does not implement rainfall-runoff,
    SWMM, Saint-Venant, Muskingum, pump-curve, or water-quality kinetics.
  - Water quantities are mapped as kg/s, and any volume-to-mass conversion must be
    explicit before mapping.
  - Overflow, infiltration, and storage accumulation signs are caller-supplied conventions
    documented by the template metadata.
  - Pump-station checks are aggregate power and range sanity checks, not hydraulic
    performance models.
  - Pollutant-load checks are kg/s load accounting and do not infer concentration
    dynamics or first-flush behavior.
fault_variants:
- id: unreported_overflow
  kind: fault
  description: Original omitted-flow fault, evaluated on the declared detailed operating
    point.
  changes:
  - variable: controlled_overflow_mass_flow.value
    set: 0.0
  expect_blocks:
  - stormwater_sewer_drainage
  - sewer_conveyance
- id: within_original_tolerance
  kind: benign
  changes:
  - variable: sewer_storage_rate.value
    offset: 1.0000000000000002e-12
