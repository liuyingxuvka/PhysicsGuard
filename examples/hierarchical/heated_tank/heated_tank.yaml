# PhysicsGuard hierarchical audit model
# Purpose: Measured heated-tank command, electrical power, volume and energy audits in one six-block hierarchy.
# Repository: https://github.com/liuyingxuvka/PhysicsGuard
# Use with: python -m physicsguard.cli hierarchy run examples/hierarchical/heated_tank/heated_tank.yaml --pretty
# Boundary: Low-fidelity SI-unit residual audit only; not a high-fidelity solver, commercial-tool adapter, or reverse-engineered model.
audit_name: heated_tank
description: Measured heated-tank command, electrical power, volume and energy audits
  in one six-block hierarchy.
system:
  system_name: heated_tank
  components:
  # Explicit fixed nameplate signal, matching the assumption below; not a measurement.
  - id: heater_nameplate
    type: SumModule
    parameters:
      input_variables: [heater_eff.efficiency]
      weights: [0.0]
      output_variable: heater_eff.efficiency
      bias: 0.98
      residual_scale: 0.1
  - id: lvl_prev
    type: TankLevelVolumeModule
    parameters:
      area_m2: 0.5
      residual_scale_m3: 0.0005
    variable_overrides:
      level_m: {initial_guess: 1.0}
      volume_m3: {initial_guess: 0.5}
  - id: lvl_cur
    type: TankLevelVolumeModule
    parameters:
      area_m2: 0.5
      residual_scale_m3: 0.0005
    variable_overrides:
      level_m: {initial_guess: 1.0}
      volume_m3: {initial_guess: 0.5}
  - id: vol
    type: TankVolumeRateModule
    parameters:
      dt_s: 10.0
      residual_scale_m3: 0.0005
    variable_overrides:
      volume_previous_m3: {initial_guess: 0.5}
      volume_current_m3: {initial_guess: 0.5}
      V_dot_in_m3_s: {initial_guess: 0.001}
      V_dot_out_m3_s: {initial_guess: 0.001}
  - id: inflow_mass
    type: VolumetricMassFlowConversionModule
    parameters:
      rho_kg_m3: 1000.0
      residual_scale_kg_s: 0.001
    variable_overrides:
      V_dot_m3_s: {initial_guess: 0.001}
      m_dot_kg_s: {initial_guess: 1.0}
  - id: heater_el
    type: ElectricalPowerModule
    parameters:
      residual_scale_W: 200.0
      P_upper_bound: 1.0e5
    variable_overrides:
      V_V: {initial_guess: 400.0}
      current_A: {initial_guess: 50.0}
      P_W: {initial_guess: 20000.0}
  - id: heater_cmd
    type: LinearRelationModule
    parameters:
      a: 1.0
      b: 0.0
      residual_scale: 400.0
      x_unit: W
      y_unit: W
      x_lower_bound: 0.0
      x_upper_bound: 1.0e5
      x_initial_guess: 20000.0
      x_scale: 1000.0
      y_lower_bound: 0.0
      y_upper_bound: 1.0e5
      y_initial_guess: 20000.0
      y_scale: 1000.0
    variable_overrides:
      x: {initial_guess: 20000.0}
      y: {initial_guess: 20000.0}
  - id: heater_eff
    type: EfficiencyModule
    parameters:
      residual_scale: 0.01
    variable_overrides:
      input_power_W: {initial_guess: 20000.0}
      useful_output_power_W: {initial_guess: 19600.0}
      efficiency: {initial_guess: 0.98}
  - id: through
    type: CoolantHeatBalanceModule
    parameters:
      cp_J_kgK: 4186.0
      residual_scale_W: 200.0
    variable_overrides:
      m_dot_kg_s: {initial_guess: 1.0}
      T_in_K: {initial_guess: 295.0}
      T_out_K: {initial_guess: 300.0}
      Q_dot_W: {initial_guess: 20930.0}
  - id: loss
    type: AmbientHeatLossModule
    parameters:
      UA_W_K: 20.0
      residual_scale_W: 200.0
    variable_overrides:
      T_body_K: {initial_guess: 300.0}
      T_ambient_K: {initial_guess: 295.0}
      Q_loss_W: {initial_guess: 100.0}
  - id: qout
    type: SumModule
    parameters:
      input_variables:
      - through.Q_dot_W
      - loss.Q_loss_W
      output_variable: heat.Q_out_W
      residual_scale: 200.0
  - id: heat
    type: ThermalMassStepModule
    parameters:
      C_J_K: 2093000.0
      dt_s: 10.0
      residual_scale_K: 0.005
      Q_in_lower_bound: -1.0e6
      Q_out_lower_bound: -1.0e6
    variable_overrides:
      T_previous_K: {initial_guess: 300.0}
      T_current_K: {initial_guess: 299.99316770186334}
      Q_in_W: {initial_guess: 19600.0}
      Q_out_W: {initial_guess: 21030.0}
  - id: tank_energy
    type: ThermalMassStepModule
    parameters:
      C_J_K: 2093000.0
      dt_s: 10.0
      residual_scale_K: 0.005
      Q_in_lower_bound: -1.0e6
      Q_out_lower_bound: -1.0e6
    variable_overrides:
      T_previous_K: {initial_guess: 300.0}
      T_current_K: {initial_guess: 299.99316770186334}
      Q_in_W: {initial_guess: 19600.0}
      Q_out_W: {initial_guess: 21030.0}
  - id: tank_volume
    type: TankVolumeRateModule
    parameters:
      dt_s: 10.0
      residual_scale_m3: 0.0005
    variable_overrides:
      volume_previous_m3: {initial_guess: 0.5}
      volume_current_m3: {initial_guess: 0.5}
      V_dot_in_m3_s: {initial_guess: 0.001}
      V_dot_out_m3_s: {initial_guess: 0.001}
  connections:
  - from_variable: lvl_prev.volume_m3
    to_variable: vol.volume_previous_m3
  - from_variable: lvl_cur.volume_m3
    to_variable: vol.volume_current_m3
  - from_variable: inflow_mass.V_dot_m3_s
    to_variable: vol.V_dot_in_m3_s
  - from_variable: inflow_mass.m_dot_kg_s
    to_variable: through.m_dot_kg_s
  - from_variable: heater_cmd.y
    to_variable: heater_el.P_W
    description: commanded power should be delivered electrical power
  - from_variable: heater_el.P_W
    to_variable: heater_eff.input_power_W
  - from_variable: heater_eff.useful_output_power_W
    to_variable: heat.Q_in_W
  - from_variable: heat.T_previous_K
    to_variable: through.T_out_K
  - from_variable: heat.T_previous_K
    to_variable: loss.T_body_K
  - from_variable: heat.T_previous_K
    to_variable: tank_energy.T_previous_K
  - from_variable: heat.T_current_K
    to_variable: tank_energy.T_current_K
  - from_variable: heat.Q_in_W
    to_variable: tank_energy.Q_in_W
  - from_variable: heat.Q_out_W
    to_variable: tank_energy.Q_out_W
  - from_variable: vol.volume_previous_m3
    to_variable: tank_volume.volume_previous_m3
  - from_variable: vol.volume_current_m3
    to_variable: tank_volume.volume_current_m3
  - from_variable: vol.V_dot_in_m3_s
    to_variable: tank_volume.V_dot_in_m3_s
  - from_variable: vol.V_dot_out_m3_s
    to_variable: tank_volume.V_dot_out_m3_s
  solver:
    method: least_squares
    max_iterations: 60
    audit_threshold: 1.0
    tolerance: 1.0e-08
  assumptions:
  - id: heater_nameplate_efficiency
    target_type: variable
    target: heater_eff.efficiency
    value: 0.98
    unit: '1'
    reason: The measured-only snapshot uses the explicitly declared heater nameplate
      efficiency.
    source: 'heater nameplate: reference-fixture nominal efficiency 0.98'
    impact: medium
    review_required: true
hierarchy:
  blocks:
  - id: tank
    name: Heated water tank
    level: 0
    components:
    - tank_energy
    - tank_volume
  - id: hydraulics
    level: 1
    parent_id: tank
    refines: [tank_volume]
    components:
    - lvl_prev
    - lvl_cur
    - vol
    - inflow_mass
  - id: thermal
    level: 1
    parent_id: tank
    refines: [tank_energy]
    components:
    - heat
    - qout
  - id: heater
    name: 'Heater: command -> electrical power -> heat'
    level: 2
    parent_id: thermal
    components:
    - heater_nameplate
    - heater_cmd
    - heater_el
    - heater_eff
  - id: throughflow
    level: 2
    parent_id: thermal
    components:
    - through
  - id: envelope
    level: 2
    parent_id: thermal
    components:
    - loss
  refinement_rules:
  - id: refine_thermal
    block_id: thermal
    trigger_diagnostic_keys:
    - thermal_mass_temperature_step_mismatch
    score_threshold: 1.0
    next_template_ids:
    - heater
    next_required_variables:
    - heater current
    - heater voltage
    - heater element temperature
    next_required_parameters:
    - heater efficiency
    rationale: Energy does not close; split heater, throughflow and loss.
    priority: 10
  - id: refine_envelope
    block_id: envelope
    trigger_diagnostic_keys:
    - ambient_heat_loss_mismatch
    score_threshold: 1.0
    next_template_ids:
    - envelope_wall_detail
    next_required_variables:
    - wall surface temperature
    - air temperature near the wall
    next_required_parameters:
    - wall area
    - wall U-value
    rationale: Ambient loss does not close; split the wall conduction from the surface-to-air transfer.
    priority: 5
fault_variants:
- id: heater_half
  kind: fault
  description: One of two heater elements fails.
  changes:
  - variable: heater_el.current_A
    scale: 0.5
  rederive: [heat.T_current_K]
  expect_blocks: [heater]
- id: extra_wall_loss
  kind: fault
  description: An alternate device has larger wall heat loss.
  parameters: {loss.UA_W_K: 400.0}
  rederive: [heat.T_current_K]
  expect_blocks: [tank, thermal]
- id: inlet_temp_offset
  kind: fault
  description: The inlet temperature sensor has a positive offset.
  changes:
  - variable: through.T_in_K
    offset: 2.4
  expect_blocks: [tank, thermal]
- id: outflow_unit_x1000
  kind: fault
  description: The measured volumetric outflow has a unit scale error.
  changes:
  - variable: vol.V_dot_out_m3_s
    scale: 1000.0
  expect_blocks: [tank, hydraulics]
- id: outflow_rounding
  kind: benign
  description: A one-millilitre-per-second outflow rounding offset stays within tolerance.
  changes:
  - variable: vol.V_dot_out_m3_s
    offset: 1.0e-6
