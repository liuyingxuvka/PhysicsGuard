# PhysicsGuard hierarchical audit/model blueprint
# Purpose: Coarse volume and energy balances over one measured 10-second step.
# Repository: https://github.com/liuyingxuvka/PhysicsGuard
# Use with: python -m physicsguard.cli hierarchy inspect first_step_level0.yaml --pretty
# Boundary: Low-fidelity SI-unit residual audit or blueprint only; not a high-fidelity solver, commercial-tool adapter, or reverse-engineered model.
audit_name: heated_tank_level_0
description: Whole-tank single-step volume and energy balance.
system:
  system_name: heated_tank_level_0
  components:
  - id: lvl_prev
    type: TankLevelVolumeModule
    parameters:
      area_m2: 0.5
      residual_scale_m3: 0.0005
  - id: lvl_cur
    type: TankLevelVolumeModule
    parameters:
      area_m2: 0.5
      residual_scale_m3: 0.0005
  - id: vol
    type: TankVolumeRateModule
    parameters:
      dt_s: 10.0
      residual_scale_m3: 0.0005
  - id: inflow_mass
    type: VolumetricMassFlowConversionModule
    parameters:
      rho_kg_m3: 1000.0
      residual_scale_kg_s: 0.001
  - id: through
    type: CoolantHeatBalanceModule
    parameters:
      cp_J_kgK: 4186.0
      residual_scale_W: 200.0
  - id: loss
    type: AmbientHeatLossModule
    parameters:
      UA_W_K: 20.0
      residual_scale_W: 200.0
  - id: qout
    type: SumModule
    parameters:
      input_variables:
      - through.Q_dot_W
      - loss.Q_loss_W
      output_variable: heat.Q_out_W
      residual_scale: 200.0
  - id: heat
    type: ThermalMassStepModule
    parameters:
      C_J_K: 2093000.0
      dt_s: 10.0
      residual_scale_K: 0.005
      Q_in_lower_bound: -1.0e6
      Q_out_lower_bound: -1.0e6
  connections:
  - from_variable: lvl_prev.volume_m3
    to_variable: vol.volume_previous_m3
    description: same tank volume at step start
  - from_variable: lvl_cur.volume_m3
    to_variable: vol.volume_current_m3
    description: same tank volume at step end
  - from_variable: inflow_mass.V_dot_m3_s
    to_variable: vol.V_dot_in_m3_s
    description: inflow
  - from_variable: inflow_mass.m_dot_kg_s
    to_variable: through.m_dot_kg_s
    description: inflow mass flow carries enthalpy
  - from_variable: heat.T_previous_K
    to_variable: through.T_out_K
    description: 'well mixed: outflow at tank temperature'
  - from_variable: heat.T_previous_K
    to_variable: loss.T_body_K
    description: wall loss at tank temperature
  solver:
    method: least_squares
    max_iterations: 60
    audit_threshold: 1.0
    tolerance: 1.0e-08
hierarchy:
  blocks:
  - id: tank
    name: Heated water tank
    level: 0
    components: []
  - id: hydraulics
    name: Volume balance (inflow, orifice outflow, level)
    level: 1
    parent_id: tank
    components:
    - lvl_prev
    - lvl_cur
    - vol
    - inflow_mass
  - id: thermal
    name: Energy balance (heater, throughflow enthalpy, wall loss)
    level: 1
    parent_id: tank
    components:
    - heat
    - through
    - loss
    - qout
  refinement_rules:
  - id: refine_thermal
    block_id: thermal
    trigger_diagnostic_keys:
    - thermal_mass_temperature_step_mismatch
    score_threshold: 1.0
    next_template_ids:
    - tank_level1_heater
    next_required_variables:
    - heater current
    - heater voltage
    - heater element temperature
    next_required_parameters:
    - heater efficiency
    rationale: Energy does not close; split heater, throughflow and loss.
    priority: 10
  - id: refine_hydraulics
    block_id: hydraulics
    trigger_diagnostic_keys:
    - tank_volume_rate_mismatch
    score_threshold: 1.0
    next_template_ids:
    - tank_level1_orifice
    next_required_variables:
    - outflow pressure
    - orifice opening
    rationale: Volume does not close; check flow meters and level sensor.
    priority: 10
