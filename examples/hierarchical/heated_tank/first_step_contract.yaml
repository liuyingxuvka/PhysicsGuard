# PhysicsGuard test-file contract
# Purpose: first step contract.
# Repository: https://github.com/liuyingxuvka/PhysicsGuard
# Use with: python -m physicsguard.cli testfile contract-check examples/hierarchical/heated_tank/first_step_contract.yaml --pretty
# Boundary: Low-fidelity SI-unit residual audit or blueprint only; not a high-fidelity solver, commercial-tool adapter, or reverse-engineered model.
contract_id: tank_run_first_step
data_file: tank_run.csv
manifest: tank_run_manifest.yaml
model: first_step_level0.yaml
time_column: time_s
fields:
  time_s:
    unit: s
    role: ignored
    reason: Series clock
  level_m:
    unit: m
    role: measured
    targets:
      row: lvl_prev.level_m
      next_row: lvl_cur.level_m
    confidence: high
    evidence: Tank level sensor
  inflow_Lps:
    unit: L/s
    role: measured
    target: inflow_mass.V_dot_m3_s
    confidence: high
    evidence: Inflow measurement
  outflow_m3s:
    unit: m^3/s
    role: measured
    target: vol.V_dot_out_m3_s
    confidence: high
    evidence: Outflow measurement
  T_in_C:
    unit: degC
    role: measured
    target: through.T_in_K
    confidence: high
    evidence: Inlet temperature sensor
  T_tank_C:
    unit: degC
    role: measured
    targets:
      row: heat.T_previous_K
      next_row: heat.T_current_K
    confidence: high
    evidence: Tank temperature sensor
  T_amb_C:
    unit: degC
    role: measured
    target: loss.T_ambient_K
    confidence: high
    evidence: Ambient temperature sensor
  P_heater_cmd_kW:
    unit: kW
    role: command
    target: heat.Q_in_W
    confidence: low
    evidence: Command used as delivered heat only in the coarse audit hypothesis
  I_heater_A:
    role: ignored
    unit: A
    reason: Electrical sensors are outside this coarse thermal model
  U_heater_V:
    role: ignored
    unit: V
    reason: Electrical sensors are outside this coarse thermal model
metadata:
  testbench_version: v1
  coverage_reason: Low-confidence delivered-heat hypothesis is retained for coarse
    debugging; native evaluation keeps the mapping uncertainty.
coverage:
  min_confidence: 0.3
