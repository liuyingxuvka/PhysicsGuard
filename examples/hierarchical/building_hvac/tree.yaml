# PhysicsGuard hierarchical audit model
# Purpose: Connected L0 plant balances and L1 zone, water loop, chiller, air-handler, electrical and campus metering audits at one SI working point.
# Repository: https://github.com/liuyingxuvka/PhysicsGuard
# Use with: python -m physicsguard.cli hierarchy run examples/hierarchical/building_hvac/tree.yaml --pretty
# Boundary: Low-fidelity SI-unit residual audit only; not a high-fidelity solver, commercial-tool adapter, or reverse-engineered model.
audit_name: building_hvac_connected_tree
description: Connected L0 plant balances and L1 zone, water loop, chiller, air-handler,
  electrical and campus metering audits at one SI working point.
system:
  system_name: building_hvac_connected_tree
  components:
  - id: coarse_envelope_heat_gain
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 12000.0
      scale: 10000.0
      external_signal: mapped_envelope_heat_gain
      mapping_confidence: template
  - id: coarse_internal_heat_gain
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 8000.0
      scale: 10000.0
      external_signal: mapped_internal_heat_gain
      mapping_confidence: template
  - id: coarse_ventilation_heat_gain
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 5000.0
      scale: 1000.0
      external_signal: mapped_ventilation_heat_gain
      mapping_confidence: template
  - id: coarse_cooling_coil_load
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 25000.0
      scale: 10000.0
      external_signal: mapped_cooling_coil_load
      mapping_confidence: template
  - id: coarse_chiller_cooling_output
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 26000.0
      scale: 10000.0
      external_signal: mapped_chiller_evaporator_cooling
      mapping_confidence: template
  - id: coarse_zone_cooling_balance
    type: AggregateThermalBalanceModule
    parameters:
      heat_in_variables:
      - coarse_envelope_heat_gain.value
      - coarse_internal_heat_gain.value
      - coarse_ventilation_heat_gain.value
      heat_out_variables:
      - coarse_cooling_coil_load.value
      residual_scale_W: 100.0
  - id: coarse_chiller_heat_balance
    type: AggregateThermalBalanceModule
    parameters:
      heat_in_variables:
      - coarse_chiller_cooling_output.value
      - chiller_electric_power.value
      heat_out_variables:
      - condenser_heat_rejection.value
      residual_scale_W: 100.0
  - id: coarse_chiller_cop_check
    type: AggregateEfficiencyModule
    parameters:
      useful_output_power_variable: coarse_chiller_cooling_output.value
      input_power_variable: chiller_electric_power.value
      efficiency_variable: chiller_cop.value
      residual_scale: 0.01
  - id: coarse_hvac_electrical_balance
    type: AggregateElectricalBusBalanceModule
    parameters:
      generation_power_variables:
      - grid_power.value
      consumption_power_variables:
      - chiller_electric_power.value
      - supply_fan_power.value
      - chilled_water_pump_power.value
      - condenser_pump_tower_power.value
      - controls_power.value
      residual_scale_W: 100.0
  - id: zone_envelope_gain
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 12000.0
      scale: 10000.0
      external_signal: mapped_zone_envelope_heat_gain
      mapping_confidence: template
  - id: zone_internal_gain
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 8000.0
      scale: 10000.0
      external_signal: mapped_zone_internal_heat_gain
      mapping_confidence: template
  - id: zone_ventilation_gain
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 5000.0
      scale: 1000.0
      external_signal: mapped_zone_ventilation_heat_gain
      mapping_confidence: template
  - id: zone_cooling_coil_load
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 25000.0
      scale: 10000.0
      external_signal: mapped_zone_cooling_coil_load
      mapping_confidence: template
  - id: chilled_water_distribution_gain
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 1000.0
      scale: 1000.0
      external_signal: mapped_chilled_water_distribution_heat_gain
      mapping_confidence: template
  - id: chiller_evaporator_cooling
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 26000.0
      scale: 10000.0
      external_signal: mapped_chiller_evaporator_cooling
      mapping_confidence: template
  - id: chiller_electric_power
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 8000.0
      scale: 1000.0
      external_signal: mapped_chiller_electric_power
      mapping_confidence: template
  - id: condenser_heat_rejection
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 34000.0
      scale: 10000.0
      external_signal: mapped_condenser_heat_rejection
      mapping_confidence: template
  - id: chiller_cop
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: null
      lower_bound: 0.0
      upper_bound: 20.0
      initial_guess: 3.25
      scale: 1.0
      external_signal: mapped_chiller_cop
      mapping_confidence: template
  - id: cooling_tower_rejection
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 34000.0
      scale: 10000.0
      external_signal: mapped_cooling_tower_heat_rejection
      mapping_confidence: template
  - id: supply_fan_power
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 2000.0
      scale: 1000.0
      external_signal: mapped_supply_fan_power
      mapping_confidence: template
  - id: fan_heat_to_air
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 2000.0
      scale: 1000.0
      external_signal: mapped_fan_heat_to_supply_air
      mapping_confidence: template
  - id: chilled_water_pump_power
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 1000.0
      scale: 1000.0
      external_signal: mapped_chilled_water_pump_power
      mapping_confidence: template
  - id: condenser_pump_tower_power
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 800.0
      scale: 1000.0
      external_signal: mapped_condenser_pump_tower_power
      mapping_confidence: template
  - id: controls_power
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 200.0
      scale: 100.0
      external_signal: mapped_controls_or_other_hvac_power
      mapping_confidence: template
  - id: grid_power
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 12000.0
      scale: 10000.0
      external_signal: mapped_building_hvac_grid_power
      mapping_confidence: template
  - id: district_chilled_water_import
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 26000.0
      scale: 1000.0
      external_signal: mapped_district_chilled_water_import
      mapping_confidence: template
  - id: district_cooling_to_load
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 25000.0
      scale: 1000.0
      external_signal: mapped_district_cooling_to_load
      mapping_confidence: template
  - id: district_distribution_loss
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 100000000.0
      initial_guess: 1000.0
      scale: 100.0
      external_signal: mapped_district_distribution_loss
      mapping_confidence: template
  - id: zone_cooling_balance
    type: AggregateThermalBalanceModule
    parameters:
      heat_in_variables:
      - zone_envelope_gain.value
      - zone_internal_gain.value
      - zone_ventilation_gain.value
      heat_out_variables:
      - zone_cooling_coil_load.value
      residual_scale_W: 100.0
  - id: chilled_water_loop_balance
    type: AggregateThermalBalanceModule
    parameters:
      heat_in_variables:
      - zone_cooling_coil_load.value
      - chilled_water_distribution_gain.value
      heat_out_variables:
      - chiller_evaporator_cooling.value
      residual_scale_W: 100.0
  - id: chiller_condenser_balance
    type: AggregateThermalBalanceModule
    parameters:
      heat_in_variables:
      - chiller_evaporator_cooling.value
      - chiller_electric_power.value
      heat_out_variables:
      - condenser_heat_rejection.value
      residual_scale_W: 100.0
  - id: chiller_cop_check
    type: AggregateEfficiencyModule
    parameters:
      useful_output_power_variable: chiller_evaporator_cooling.value
      input_power_variable: chiller_electric_power.value
      efficiency_variable: chiller_cop.value
      residual_scale: 0.01
  - id: condenser_loop_balance
    type: AggregateThermalBalanceModule
    parameters:
      heat_in_variables:
      - condenser_heat_rejection.value
      heat_out_variables:
      - cooling_tower_rejection.value
      residual_scale_W: 100.0
  - id: fan_heat_balance
    type: AggregatePowerBalanceModule
    parameters:
      source_power_variables:
      - supply_fan_power.value
      load_power_variables:
      - fan_heat_to_air.value
      residual_scale_W: 100.0
  - id: plant_electrical_balance
    type: AggregateElectricalBusBalanceModule
    parameters:
      generation_power_variables:
      - grid_power.value
      consumption_power_variables:
      - chiller_electric_power.value
      - supply_fan_power.value
      - chilled_water_pump_power.value
      - condenser_pump_tower_power.value
      - controls_power.value
      residual_scale_W: 100.0
  - id: district_energy_balance
    type: AggregateThermalBalanceModule
    parameters:
      heat_in_variables:
      - district_chilled_water_import.value
      heat_out_variables:
      - district_cooling_to_load.value
      - district_distribution_loss.value
      residual_scale_W: 100.0
  connections:
  - from_variable: coarse_envelope_heat_gain.value
    to_variable: zone_envelope_gain.value
  - from_variable: coarse_internal_heat_gain.value
    to_variable: zone_internal_gain.value
  - from_variable: coarse_ventilation_heat_gain.value
    to_variable: zone_ventilation_gain.value
  - from_variable: coarse_cooling_coil_load.value
    to_variable: zone_cooling_coil_load.value
  - from_variable: coarse_chiller_cooling_output.value
    to_variable: chiller_evaporator_cooling.value
  - from_variable: chiller_evaporator_cooling.value
    to_variable: district_chilled_water_import.value
  - from_variable: zone_cooling_coil_load.value
    to_variable: district_cooling_to_load.value
  - from_variable: chilled_water_distribution_gain.value
    to_variable: district_distribution_loss.value
  boundaries:
  - variable: coarse_envelope_heat_gain.value
    value: 12000.0
    scale: 1.0e-06
  - variable: coarse_internal_heat_gain.value
    value: 8000.0
    scale: 1.0e-06
  - variable: coarse_ventilation_heat_gain.value
    value: 5000.0
    scale: 1.0e-06
  - variable: coarse_cooling_coil_load.value
    value: 25000.0
    scale: 1.0e-06
  - variable: coarse_chiller_cooling_output.value
    value: 26000.0
    scale: 1.0e-06
  - variable: chiller_electric_power.value
    value: 8000.0
    scale: 1.0e-06
  - variable: condenser_heat_rejection.value
    value: 34000.0
    scale: 1.0e-06
  - variable: chiller_cop.value
    value: 3.25
    scale: 1.0e-09
  - variable: chilled_water_pump_power.value
    value: 1000.0
    scale: 1.0e-06
  - variable: condenser_pump_tower_power.value
    value: 800.0
    scale: 1.0e-06
  - variable: controls_power.value
    value: 200.0
    scale: 1.0e-06
  assumptions:
  - id: positive_si_heat_flow
    target_type: context
    target: building_hvac.positive_si_heat_flow
    value: true
    reason: Cooling and electric powers use positive W magnitudes; heat gains enter
      the cooling-load accounting.
    source: explicit starter-pack modeling boundary
    impact: medium
    review_required: true
    status: active
  - id: campus_metering_boundary
    target_type: context
    target: building_hvac.campus_metering_boundary
    value: true
    reason: 'The district-energy interface meters the same campus plant-to-building
      chilled-water link: import is evaporator cooling, delivered cooling is coil
      load, and distribution lost useful cooling is distribution heat gain. It is
      not an additional cooling source.'
    source: explicit starter-pack modeling boundary
    impact: medium
    review_required: true
    status: active
  - id: snapshot_scope
    target_type: context
    target: building_hvac.snapshot_scope
    value: true
    reason: Algebraic steady snapshot accounting only, without storage, detailed building
      dynamics, chiller curves or commercial-solver equivalence.
    source: explicit starter-pack modeling boundary
    impact: medium
    review_required: true
    status: active
  - id: fan_heat_accounting
    target_type: context
    target: building_hvac.fan_heat_accounting
    value: true
    reason: At this boundary the full supply-fan electric input becomes supply-stream
      heat, as in the original L1 fan accounting.
    source: explicit starter-pack modeling boundary
    impact: medium
    review_required: true
    status: active
  - id: cop_accounting
    target_type: context
    target: building_hvac.cop_accounting
    value: true
    reason: COP is cooling-output/electric-input accounting, derived from heat and
      electric meters rather than treated as an independent physical property measurement.
    source: explicit starter-pack modeling boundary
    impact: medium
    review_required: true
    status: active
  solver:
    tolerance: 1.0e-08
    audit_threshold: 1.0
hierarchy:
  blocks:
  - id: building_hvac
    name: Building HVAC plant
    level: 0
    components:
    - coarse_envelope_heat_gain
    - coarse_internal_heat_gain
    - coarse_ventilation_heat_gain
    - coarse_cooling_coil_load
    - coarse_chiller_cooling_output
    - coarse_zone_cooling_balance
    - coarse_chiller_heat_balance
    - coarse_chiller_cop_check
    - coarse_hvac_electrical_balance
    tags:
    - building_hvac
    - level_0
    - cooling_load
    - chiller
    - electrical_balance
    required_variables:
    - coarse_envelope_heat_gain.value
    - coarse_internal_heat_gain.value
    - coarse_ventilation_heat_gain.value
    - coarse_cooling_coil_load.value
    - coarse_chiller_cooling_output.value
  - id: zone_loads
    name: Zone cooling load
    level: 1
    parent_id: building_hvac
    components:
    - zone_envelope_gain
    - zone_internal_gain
    - zone_ventilation_gain
    - zone_cooling_coil_load
    - zone_cooling_balance
    tags:
    - zone
    - cooling_load
    required_variables:
    - zone_envelope_gain.value
    - zone_internal_gain.value
    - zone_ventilation_gain.value
    - zone_cooling_coil_load.value
    refines:
    - coarse_zone_cooling_balance
  - id: chilled_water_loop
    name: Chilled-water loop
    level: 1
    parent_id: building_hvac
    components:
    - chilled_water_distribution_gain
    - chiller_evaporator_cooling
    - chilled_water_loop_balance
    tags:
    - chilled_water
    - distribution
  - id: chiller_condenser
    name: Chiller and condenser
    level: 1
    parent_id: building_hvac
    components:
    - chiller_electric_power
    - condenser_heat_rejection
    - chiller_cop
    - cooling_tower_rejection
    - chiller_condenser_balance
    - chiller_cop_check
    - condenser_loop_balance
    tags:
    - chiller
    - condenser
    - cooling_tower
    - cop
    refines:
    - coarse_chiller_heat_balance
    - coarse_chiller_cop_check
  - id: air_handler
    name: Air handler
    level: 1
    parent_id: building_hvac
    components:
    - supply_fan_power
    - fan_heat_to_air
    - fan_heat_balance
    tags:
    - ahu
    - fan
  - id: plant_electrical
    name: Plant electrical
    level: 1
    parent_id: building_hvac
    components:
    - chilled_water_pump_power
    - condenser_pump_tower_power
    - controls_power
    - grid_power
    - plant_electrical_balance
    tags:
    - electrical
    - pumps
    - controls
    refines:
    - coarse_hvac_electrical_balance
  - id: district_energy_interface
    name: District chilled-water interface
    level: 1
    parent_id: building_hvac
    components:
    - district_chilled_water_import
    - district_cooling_to_load
    - district_distribution_loss
    - district_energy_balance
    tags:
    - district_energy
    - chilled_water
    description: 'Campus metering of the same chilled-water link: import at evaporator,
      delivery at coil, and lost useful cooling equal to distribution heat gain.'
  refinement_rules:
  - id: refine_building_hvac_level_0
    block_id: building_hvac
    trigger_diagnostic_keys:
    - aggregate_thermal_balance_mismatch
    - aggregate_efficiency_mismatch
    - aggregate_electrical_bus_balance_mismatch
    score_threshold: 1.0
    next_template_ids:
    - zone_loads
    - chilled_water_loop
    - chiller_condenser
    - air_handler
    - plant_electrical
    - district_energy_interface
    next_required_variables:
    - zone_cooling_coil_load.value
    - chiller_evaporator_cooling.value
    - chiller_electric_power.value
    - condenser_heat_rejection.value
    - supply_fan_power.value
    rationale: Coarse HVAC balance residual is high; refine zone load, chilled-water
      loop, chiller/condenser, fans, pumps, and electrical metering.
    priority: 10
  scoring:
    method: max
fault_variants:
- id: unmet_cooling_load
  kind: fault
  description: 'A supplied-signal fault: zone_cooling_coil_load.value reads 22000;
    it fails in building_hvac, chilled_water_loop, district_energy_interface, zone_loads.'
  changes:
  - variable: zone_cooling_coil_load.value
    set: 22000.0
  expect_blocks:
  - building_hvac
  - chilled_water_loop
  - district_energy_interface
  - zone_loads
- id: chilled_water_pump_power_sensor_gain
  kind: fault
  description: The chilled_water_pump_power.value sensor reads 50% high (gain error);
    its own relation fails in building_hvac, plant_electrical.
  changes:
  - variable: chilled_water_pump_power.value
    scale: 1.5
  expect_blocks:
  - building_hvac
  - plant_electrical
- id: fan_auxiliary_plus_50W
  kind: benign
  description: Supply fan and its electrical feeder both rise by 50 W; air-side fan
    heat also rises by 50 W and all accounting remains conserved.
  changes:
  - variable: supply_fan_power.value
    offset: 50.0
  - variable: grid_power.value
    offset: 50.0
  - variable: fan_heat_to_air.value
    offset: 50.0
- id: chilled_water_distribution_gain_within_tolerance
  kind: benign
  description: 'Measurement error inside the declared tolerance: chilled_water_distribution_gain.value
    reads +30 W; it moves a checked residual by about 0.3 of its scale, below the
    audit threshold, and must stay neutral.'
  changes:
  - variable: chilled_water_distribution_gain.value
    offset: 30.0
metadata:
  domain: building_hvac
  reference_point_note: Reference solve uses declared SI operating conditions and
    consistent initial guesses. Fan and total grid power are free to vary together,
    so the reference point is not claimed unique.
  measurement_boundary: nominal_observed.yaml is a selected synthetic reference solution
    with proposed physical meter mappings, not real bench evidence.
