# PhysicsGuard hierarchical audit model
# Purpose: Global plant budget and separately scoped unit-accounting records in one audit tree. The global budget is an independent supplied boundary record,...
# Repository: https://github.com/liuyingxuvka/PhysicsGuard
# Use with: python -m physicsguard.cli hierarchy run examples/hierarchical/wastewater_treatment/tree.yaml --pretty
# Boundary: Low-fidelity SI-unit residual audit only; not a high-fidelity solver, commercial-tool adapter, or reverse-engineered model.
audit_name: wastewater_scoped_tree
description: Global plant budget and separately scoped unit-accounting records in
  one audit tree. The global budget is an independent supplied boundary record, not
  a same-operating-point whole-plant closure derived or verified from these four unit
  records.
system:
  system_name: wastewater_scoped_tree
  components:
  - id: global_influent_flow
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: kg/s
      lower_bound: 0.0
      upper_bound: 100.0
      initial_guess: 1.2
      scale: 1.0
      external_signal: mapped_influent_mass_flow
      mapping_confidence: template
  - id: global_effluent_flow
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: kg/s
      lower_bound: 0.0
      upper_bound: 100.0
      initial_guess: 1.0
      scale: 1.0
      external_signal: mapped_effluent_mass_flow
      mapping_confidence: template
  - id: global_waste_sludge_flow
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: kg/s
      lower_bound: 0.0
      upper_bound: 100.0
      initial_guess: 0.18
      scale: 0.1
      external_signal: mapped_waste_sludge_mass_flow
      mapping_confidence: template
  - id: global_gas_vent_flow
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: kg/s
      lower_bound: 0.0
      upper_bound: 10.0
      initial_guess: 0.02
      scale: 0.01
      external_signal: mapped_gas_vent_mass_flow
      mapping_confidence: template
  - id: global_cod_in
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: kg/s
      lower_bound: 0.0
      upper_bound: 10.0
      initial_guess: 0.06
      scale: 0.01
      external_signal: mapped_influent_cod_load
      mapping_confidence: template
  - id: global_cod_effluent
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: kg/s
      lower_bound: 0.0
      upper_bound: 10.0
      initial_guess: 0.01
      scale: 0.01
      external_signal: mapped_effluent_cod_load
      mapping_confidence: template
  - id: global_cod_to_sludge
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: kg/s
      lower_bound: 0.0
      upper_bound: 10.0
      initial_guess: 0.02
      scale: 0.01
      external_signal: mapped_cod_to_waste_sludge
      mapping_confidence: template
  - id: global_cod_oxidized
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: kg/s
      lower_bound: 0.0
      upper_bound: 10.0
      initial_guess: 0.03
      scale: 0.01
      external_signal: mapped_cod_oxidized_or_biogas_equivalent
      mapping_confidence: template
  - id: global_tn_in
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: kg/s
      lower_bound: 0.0
      upper_bound: 1.0
      initial_guess: 0.004
      scale: 0.001
      external_signal: mapped_influent_total_nitrogen_load
      mapping_confidence: template
  - id: global_tn_effluent
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: kg/s
