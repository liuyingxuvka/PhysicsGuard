    description: Independent global budget plus parent-owned coarse books for each
      distinct unit boundary. Unit refinements below check only their named unit books,
      never claim the global budget is closed by unit records.
  - id: biological_reactor
    name: Biological reactor
    level: 1
    parent_id: wastewater_plant
    components:
    - aeration_oxygen_transfer
    - oxygen_for_bod
    - oxygen_for_nitrification
    - oxygen_residual_or_storage
    - reactor_cod_in
    - reactor_cod_effluent
    - reactor_cod_to_biomass
    - reactor_cod_oxidized
    - reactor_oxygen_balance
    - reactor_cod_balance
    tags:
