    - clarifier_tss_effluent.value
    - clarifier_tss_return.value
    refines: &id002
    - unit_clarifier_solids_balance
  - id: sludge_recycle
    name: Sludge recycle and wasting
    level: 1
    parent_id: wastewater_plant
    components:
    - underflow_flow
    - return_sludge_flow
    - waste_sludge_flow
    - sludge_recycle_split
    tags:
    - return_activated_sludge
    - waste_activated_sludge
    refines: &id003
    - unit_sludge_recycle_split
  - id: aeration_energy
    name: Aeration energy
    level: 1
    parent_id: wastewater_plant
    components:
    - aeration_blower_power
    - air_to_water_power
    - aeration_losses
    - aeration_power_balance
    tags:
    - aeration
    - energy_balance
    refines: &id004
    - unit_aeration_power_balance
  refinement_rules:
  - id: refine_wastewater_level_0_balance
    block_id: wastewater_plant
    trigger_diagnostic_keys:
    - aggregate_mass_balance_mismatch
    - aggregate_electrical_bus_balance_mismatch
    score_threshold: 1.0
    next_template_ids:
    - biological_reactor
    - secondary_clarifier
    - sludge_recycle
    - aeration_energy
    next_required_variables:
    - aeration.oxygen_transferred_kg_s
    - reactor.oxygen_demand_kg_s
    - clarifier.solids_in_kg_s
    - clarifier.solids_effluent_kg_s
    - sludge.return_flow_kg_s
    next_required_parameters:
    - plant.signal_mapping_confidence
    - plant.COD_basis
    - plant.TN_basis
    rationale: Inspect the separately scoped unit records and their signal bases after
      a global-budget discrepancy. These suggestions do not claim the four units establish
      same-point whole-plant closure.
    priority: 10
  - id: refine_biological_reactor
    block_id: biological_reactor
    trigger_diagnostic_keys:
    - aggregate_mass_balance_mismatch
    score_threshold: 1.0
    next_template_ids: []
    next_required_variables:
    - reactor.ammonia_load_kg_s
    - reactor.nitrate_load_kg_s
    - reactor.do_kg_s_or_mg_L
    - reactor.biomass_production_kg_s
    next_required_parameters:
    - reactor.COD_basis
    - reactor.oxygen_transfer_basis
    rationale: Reactor COD or oxygen accounting residual is high; inspect ASM-style
      component mapping and oxygen demand terms before adding kinetics.
    priority: 20
  - id: refine_secondary_clarifier
    block_id: secondary_clarifier
    trigger_diagnostic_keys:
    - aggregate_mass_balance_mismatch
    score_threshold: 1.0
    next_template_ids: []
    next_required_variables:
    - clarifier.underflow_tss_kg_s
    - clarifier.effluent_tss_kg_s
    - clarifier.sludge_blanket_or_capture_indicator
    rationale: Clarifier solids residual is high; inspect TSS mappings, underflow/overflow
      split, and waste-sludge accounting.
    priority: 15
  scoring:
    method: max
metadata:
  boundary: Global and unit records have separate declared control volumes and are
    not asserted to be one reconciled whole-plant operating point.
  not_inferred:
  - global waste sludge0.18 is not unit WAS0.07
  - global oxygen0.045 is not reactor transfer0.05
  - global aeration power10000 is not unit blower12000
  - global COD effluent/sludge are not reactor or clarifier COD/TSS streams
  refinement_scope:
    biological_reactor: *id001
    secondary_clarifier: *id002
    sludge_recycle: *id003
    aeration_energy: *id004
  limitations:
  - Only exact same unit quantities are connected. No invented missing waste/air/loss
    stream closes any gap.
  - Global mass/COD/nitrogen/oxygen/electrical budgets remain independently supplied
    accounting checks. Passing unit checks cannot license global plant closure.
  - No dynamic ASM kinetics, biological rate inference or inferred cross-control-volume
    conversion.
fault_variants:
- id: global_cod_loss
  kind: fault
  description: 'A supplied-signal fault: global_cod_oxidized.value reads 0.02; it
    fails in wastewater_plant.'
  changes:
  - variable: global_cod_oxidized.value
    set: 0.02
  expect_blocks:
  - wastewater_plant
- id: reactor_cod_loss
  kind: fault
  description: A separately scoped reactor COD oxidation reading changes from0.03
    to0.02kg/s; both its unit coarse book and true reactor block see the same value.
  changes:
  - variable: reactor_cod_oxidized.value
    set: 0.02
  expect_blocks:
  - wastewater_plant
  - biological_reactor
- id: unit_flow_rounding
  kind: benign
  description: 'Measurement error inside the declared tolerance: underflow_flow.value
    reads +3e-10 kg/s; it moves a checked residual by about 0.3 of its scale, below
    the audit threshold, and must stay neutral.'
  changes:
  - variable: underflow_flow.value
    offset: 3.0e-10
