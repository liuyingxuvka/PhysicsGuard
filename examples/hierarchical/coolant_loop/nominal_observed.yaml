metadata:
  provenance: Generated by one actual native hierarchy run; original BoundedSolver.solve
    return values captured transparently without changing its inputs or result.
  measurement_boundary: No real bench dataset is asserted. Synthetic reference values
    are projected onto distinct calorimetry, flow, temperature, pressure and torque-speed
    channels.
  omitted: Connection aliases, branch flows, component heat aliases, pump efficiency
    and valve split are derived or fixed by explicit assumption cards.
