# PhysicsGuard hierarchical audit model
# Purpose: One coarse-to-fine aerospace satellite thermal audit; supplied quantities connect coarse balances to their finer relations.
# Repository: https://github.com/liuyingxuvka/PhysicsGuard
# Use with: python -m physicsguard.cli hierarchy run examples/hierarchical/aerospace_satellite_thermal/tree.yaml --pretty
# Boundary: Low-fidelity SI-unit residual audit only; not a high-fidelity solver, commercial-tool adapter, or reverse-engineered model.
audit_name: aerospace_satellite_thermal
description: One coarse-to-fine aerospace satellite thermal audit; supplied quantities
  connect coarse balances to their finer relations.
system:
  system_name: aerospace_satellite_thermal
  components:
  - id: coarse_solar_array_power
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 1000000000000.0
      initial_guess: 5000.0
      scale: 500.0
      external_signal: mapped_solar_array_power
      mapping_confidence: template
  - id: coarse_payload_power
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 1000000000000.0
      initial_guess: 2000.0
      scale: 200.0
      external_signal: mapped_payload_power
      mapping_confidence: template
  - id: coarse_avionics_power
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 1000000000000.0
      initial_guess: 1000.0
      scale: 100.0
      external_signal: mapped_avionics_power
      mapping_confidence: template
  - id: coarse_battery_charge_power
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 1000000000000.0
      initial_guess: 1000.0
      scale: 100.0
      external_signal: mapped_battery_charge_power
      mapping_confidence: template
  - id: coarse_power_conversion_loss
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 1000000000000.0
      initial_guess: 1000.0
      scale: 100.0
      external_signal: mapped_power_conversion_loss
      mapping_confidence: template
  - id: coarse_satellite_power_accounting_power_balance
    type: AggregatePowerBalanceModule
    parameters:
      source_power_variables:
      - coarse_solar_array_power.value
      load_power_variables:
      - coarse_payload_power.value
      - coarse_avionics_power.value
      - coarse_battery_charge_power.value
      - coarse_power_conversion_loss.value
      residual_scale_W: 100.0
  - id: coarse_electronics_heat_generation
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 1000000000000.0
      initial_guess: 3000.0
      scale: 300.0
      external_signal: mapped_electronics_heat_generation
      mapping_confidence: template
  - id: coarse_absorbed_solar_heat
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 1000000000000.0
      initial_guess: 1000.0
      scale: 100.0
      external_signal: mapped_absorbed_solar_heat
      mapping_confidence: template
  - id: coarse_radiator_heat_rejection
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 1000000000000.0
      initial_guess: 3500.0
      scale: 350.0
      external_signal: mapped_radiator_heat_rejection
      mapping_confidence: template
  - id: coarse_thermal_storage_rate
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 1000000000000.0
      initial_guess: 500.0
      scale: 50.0
      external_signal: mapped_thermal_storage_rate
      mapping_confidence: template
  - id: coarse_bus_temperature
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: K
      lower_bound: 200.0
      upper_bound: 500.0
      initial_guess: 295.0
      scale: 1.0
      external_signal: mapped_bus_temperature
      mapping_confidence: template
  - id: coarse_satellite_thermal_accounting_thermal_balance
    type: AggregateThermalBalanceModule
    parameters:
      heat_in_variables:
      - coarse_electronics_heat_generation.value
      - coarse_absorbed_solar_heat.value
      heat_out_variables:
      - coarse_radiator_heat_rejection.value
      - coarse_thermal_storage_rate.value
      residual_scale_W: 100.0
  - id: coarse_bus_temperature_range
    type: RangeCheckModule
    parameters:
      variable: coarse_bus_temperature.value
      lower_bound: 250.0
      upper_bound: 330.0
      residual_scale: 1.0
      role: post_check
  - id: solar_array_power
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: W
      lower_bound: 0.0
      upper_bound: 1000000000000.0
      initial_guess: 5000.0
      scale: 500.0
      external_signal: mapped_solar_array_power
      mapping_confidence: template
  - id: payload_power
    type: MappedSignalModule
    parameters:
