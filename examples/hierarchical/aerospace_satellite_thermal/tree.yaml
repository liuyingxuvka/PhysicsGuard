  - id: bus_temperature
    type: MappedSignalModule
    parameters:
      local_name: value
      unit: K
      lower_bound: 200.0
      upper_bound: 500.0
      initial_guess: 295.0
      scale: 1.0
      external_signal: mapped_bus_temperature
      mapping_confidence: template
  - id: satellite_thermal_accounting_thermal_balance
    type: AggregateThermalBalanceModule
    parameters:
      heat_in_variables:
      - electronics_heat_generation.value
      - absorbed_solar_heat.value
      heat_out_variables:
      - radiator_heat_rejection.value
      - thermal_storage_rate.value
      residual_scale_W: 100.0
  - id: bus_temperature_range
    type: RangeCheckModule
    parameters:
      variable: bus_temperature.value
      lower_bound: 250.0
      upper_bound: 330.0
      residual_scale: 1.0
      role: post_check
  boundaries:
  - variable: solar_array_power.value
    value: 5000.0
    scale: 1.0e-06
  - variable: payload_power.value
    value: 2000.0
    scale: 1.0e-06
  - variable: avionics_power.value
    value: 1000.0
    scale: 1.0e-06
  - variable: battery_charge_power.value
    value: 1000.0
    scale: 1.0e-06
  - variable: power_conversion_loss.value
    value: 1000.0
    scale: 1.0e-06
  - variable: electronics_heat_generation.value
    value: 3000.0
    scale: 1.0e-06
  - variable: absorbed_solar_heat.value
    value: 1000.0
    scale: 1.0e-06
  - variable: radiator_heat_rejection.value
    value: 3500.0
    scale: 1.0e-06
  - variable: thermal_storage_rate.value
    value: 500.0
    scale: 1.0e-06
  - variable: bus_temperature.value
    value: 295.0
    scale: 1.0e-06
  solver:
    tolerance: 1.0e-08
    audit_threshold: 1.0
  connections:
  - from_variable: coarse_solar_array_power.value
    to_variable: solar_array_power.value
    description: Same supplied W quantity; no additional observation.
    scale: 1.0e-06
  - from_variable: coarse_payload_power.value
    to_variable: payload_power.value
    description: Same supplied W quantity; no additional observation.
    scale: 1.0e-06
  - from_variable: coarse_avionics_power.value
    to_variable: avionics_power.value
    description: Same supplied W quantity; no additional observation.
    scale: 1.0e-06
  - from_variable: coarse_battery_charge_power.value
    to_variable: battery_charge_power.value
    description: Same supplied W quantity; no additional observation.
    scale: 1.0e-06
  - from_variable: coarse_power_conversion_loss.value
