semantics:
- semantic_id: sem.root.initial
  owner_element_id: bouncing_ball
  semantic_kind: parameter
  statement: Initial h=1 m, v=0 m/s, and effective gravity equals the FMI g parameter.
  expression: null
  input_port_ids: []
  output_port_ids: []
  state_port_ids:
  - port.root.h
  - port.root.v
  - port.root.g_effective
  effect_port_ids: []
  validity_boundary_ids:
  - validity.root
  assumption_ids: []
  preconditions: []
  postconditions:
  - h=1
  - v=0
  - g_effective=g
- semantic_id: sem.root.free
  owner_element_id: bouncing_ball
  semantic_kind: equation
  statement: Outside a contact event, height and velocity follow dh/dt=v and dv/dt=g_effective.
  expression: dh_dt = v; dv_dt = g_effective
  input_port_ids:
  - port.root.g
  - port.root.e
  output_port_ids:
  - port.root.dh
  - port.root.dv
  state_port_ids:
  - port.root.h
  - port.root.v
  - port.root.g_effective
  effect_port_ids: []
  validity_boundary_ids:
  - validity.root
  assumption_ids: []
  preconditions:
  - continuous-time mode
  - no active ground-contact event
  postconditions: []
- semantic_id: sem.root.update
  owner_element_id: bouncing_ball
  semantic_kind: state_update
  statement: The model integrates free-flight states and atomically applies the declared
    contact branch.
  expression: (h,v,g)_next = integrate_or_contact(h,v,g,e,v_min)
  input_port_ids:
  - port.root.g
  - port.root.e
  - port.root.v_min
  output_port_ids: []
  state_port_ids:
  - port.root.h
  - port.root.v
  - port.root.g_effective
  effect_port_ids:
  - port.root.contact
  - port.root.stopped
  validity_boundary_ids:
  - validity.root
  assumption_ids: []
  preconditions: []
  postconditions:
  - contact sets h to DBL_MIN
  - a sub-threshold rebound sets v=0 and g_effective=0
- semantic_id: sem.root.impact
  owner_element_id: bouncing_ball
  semantic_kind: guarantee
  statement: At h<=0 with v<0, the rebound candidate is -e*v; if it is below v_min,
    v and effective gravity become zero.
  expression: null
  input_port_ids:
  - port.root.e
  - port.root.v_min
  output_port_ids: []
  state_port_ids:
  - port.root.h
  - port.root.v
  - port.root.g_effective
  effect_port_ids:
  - port.root.contact
  - port.root.stopped
  validity_boundary_ids:
  - validity.root
  assumption_ids: []
  preconditions:
  - h<=0
  - v<0
  postconditions:
  - candidate=-e*v
  - candidate<v_min implies v=0 and g_effective=0
- semantic_id: sem.root.protected
  owner_element_id: bouncing_ball
  semantic_kind: protected_failure
  statement: Attempts to mutate constant v_min return FMI error instead of changing
    the threshold.
  expression: null
  input_port_ids:
  - port.root.v_min
  output_port_ids: []
  state_port_ids: []
  effect_port_ids:
  - port.root.rejected
  validity_boundary_ids:
  - validity.root
  assumption_ids: []
  preconditions:
  - exact FMI 3 Model Exchange lifecycle
  postconditions:
  - invalid constant mutation returns FMI error
- semantic_id: sem.root.termination
  owner_element_id: bouncing_ball
  semantic_kind: termination
  statement: An explicit FMI terminate call moves the wrapper into its terminal state.
  expression: null
  input_port_ids: []
  output_port_ids: []
  state_port_ids:
  - port.root.h
  - port.root.v
  - port.root.g_effective
  effect_port_ids:
  - port.root.stopped
  validity_boundary_ids:
  - validity.root
  assumption_ids: []
  preconditions: []
  postconditions: []
- semantic_id: sem.free.dh
  owner_element_id: free_flight
  semantic_kind: equation
  statement: Height derivative equals vertical velocity.
  expression: dh_dt = v
  input_port_ids:
