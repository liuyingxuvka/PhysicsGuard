    semantic_kind: equation
    semantic_statement: Outside a contact event, height and velocity follow dh/dt=v and dv/dt=g_effective.
    semantic_expression: 'dh_dt = v; dv_dt = g_effective'
    claim_boundary: Verified only for this exact function and source fragment in the governed FMU member.
  - selector_id: selector.sem.root.update
