    semantic_kind: parameter
    semantic_statement: Initial h=1 m, v=0 m/s, and effective gravity equals the FMI g parameter.
    claim_boundary: Verified only for this exact function and source fragment in the governed FMU member.
  - selector_id: selector.sem.root.free
