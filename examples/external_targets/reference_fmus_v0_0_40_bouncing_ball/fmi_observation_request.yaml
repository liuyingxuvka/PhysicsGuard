oracles:
  - oracle_id: oracle.impact-momentum-reflection
    purpose: Independently recompute rebound and stop outputs from the declared impact equations.
    input_names: [v, e, vmin, g]
    expressions:
      - result_name: candidate
        expression: -e * v
      - result_name: v_post
        expression: 0.0 if candidate < vmin else candidate
      - result_name: g_post
        expression: 0.0 if candidate < vmin else g
    source_member_ids: [model-source, model-documentation]
    claim_boundary: Restricted arithmetic replays only the frozen ground-contact branch and is not the FMI implementation.
  - oracle_id: oracle.stop-threshold
    purpose: Independently recompute the rebound candidate and threshold stop branch.
    input_names: [v, e, vmin, g]
    expressions:
      - result_name: candidate
        expression: -e * v
      - result_name: v_post
        expression: 0.0 if candidate < vmin else candidate
      - result_name: g_post
        expression: 0.0 if candidate < vmin else g
    source_member_ids: [model-source, model-documentation]
    claim_boundary: Restricted arithmetic replays only the frozen ground-contact branch and is not the FMI implementation.
  - oracle_id: oracle.free-flight-kinematics
    purpose: Independently recompute free-flight derivatives without reading the implementation output.
    input_names: [v, g]
    expressions:
      - result_name: dh
        expression: v
      - result_name: dv
        expression: g
    source_member_ids: [model-source, model-documentation]
    claim_boundary: Restricted arithmetic covers only dh=v and dv=g inside the frozen continuous-time branch.
  - oracle_id: oracle.fmi-constant-contract
    purpose: Ground the protected constant-set case in the frozen FMI variable contract and source.
    input_names: [vmin]
    expressions:
      - result_name: declared_vmin
        expression: vmin
    source_member_ids: [model-description, model-source]
    claim_boundary: The FMI terminal status, not this numeric identity expression, proves rejection of the constant-set operation.
behavior_cases:
  - case_id: impact-restitution-e-0.7
    operation: event_update
    independent_oracle_id: oracle.impact-momentum-reflection
    oracle_input_bindings:
      v: v
      e: e
      vmin: v_min
      g: g
    oracle_output_bindings:
      v: v_post
      g: g_post
    purpose: At ground contact a downward speed of one is reflected with coefficient e=0.7.
    start_time: 0.0
    assignments:
      - variable_name: h
        value: 0.0
      - variable_name: v
        value: -1.0
      - variable_name: e
        value: 0.7
    read_variable_names: [v, g]
    expected_values:
      - variable_name: v
        value: 0.7
        absolute_tolerance: 1.0e-15
      - variable_name: g
        value: -9.81
        absolute_tolerance: 1.0e-15
    expected_terminal_status: ok
  - case_id: impact-below-stop-threshold
    operation: event_update
    independent_oracle_id: oracle.stop-threshold
    oracle_input_bindings:
      v: v
      e: e
      vmin: v_min
      g: g
    oracle_output_bindings:
      v: v_post
      g: g_post
    purpose: The rebound candidate 0.07 is below v_min=0.1, so the terminal state sets v and g to zero.
    start_time: 0.0
    assignments:
      - variable_name: h
        value: 0.0
      - variable_name: v
        value: -0.1
      - variable_name: e
        value: 0.7
    read_variable_names: [v, g]
    expected_values:
      - variable_name: v
        value: 0.0
        absolute_tolerance: 0.0
      - variable_name: g
        value: 0.0
        absolute_tolerance: 0.0
    expected_terminal_status: ok
  - case_id: free-flight-e-min
    operation: read_after_initialization
    independent_oracle_id: oracle.free-flight-kinematics
    oracle_input_bindings:
      v: v
      g: g
    oracle_output_bindings:
      der(h): dh
      der(v): dv
    purpose: Changing e does not change free-flight derivatives.
    start_time: 0.0
    assignments:
      - variable_name: h
        value: 1.0
      - variable_name: v
        value: 2.0
      - variable_name: g
        value: -9.81
      - variable_name: e
        value: 0.5
    read_variable_names: [der(h), der(v)]
    expected_values:
      - variable_name: der(h)
        value: 2.0
        absolute_tolerance: 0.0
      - variable_name: der(v)
        value: -9.81
        absolute_tolerance: 1.0e-15
    expected_terminal_status: ok
  - case_id: free-flight-e-max
    operation: read_after_initialization
    independent_oracle_id: oracle.free-flight-kinematics
    oracle_input_bindings:
      v: v
      g: g
    oracle_output_bindings:
      der(h): dh
      der(v): dv
    purpose: Changing e does not change free-flight derivatives.
    start_time: 0.0
    assignments:
      - variable_name: h
        value: 1.0
      - variable_name: v
        value: 2.0
      - variable_name: g
        value: -9.81
      - variable_name: e
        value: 1.0
    read_variable_names: [der(h), der(v)]
    expected_values:
      - variable_name: der(h)
        value: 2.0
        absolute_tolerance: 0.0
      - variable_name: der(v)
        value: -9.81
        absolute_tolerance: 1.0e-15
    expected_terminal_status: ok
  - case_id: v-min-is-constant
    operation: rejected_set
    independent_oracle_id: oracle.fmi-constant-contract
    oracle_input_bindings:
      vmin: v_min
    oracle_output_bindings: {}
    purpose: The FMI rejects attempts to mutate the constant stop threshold.
    start_time: 0.0
    assignments:
      - variable_name: v_min
        value: 0.2
    read_variable_names: []
    expected_values: []
    expected_terminal_status: error
