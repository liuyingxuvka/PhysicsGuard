name: PhysicsGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - name: Checkout the triggering source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install PhysicsGuard with its test extra
        run: python -m pip install -e ".[test]"

      - name: Full test suite
        run: python -m pytest -q

      - name: Strict FlowGuard map check
        if: matrix.python == '3.11'
        run: python -m flowguard map check --root . --strict

      - name: FlowGuard map, lint and models
        if: matrix.python == '3.11'
        run: python -m flowguard release

      - name: Install the skills into a scratch directory and check them
        if: matrix.python == '3.11'
        run: |
          python scripts/install_physicsguard_skills.py --target "$RUNNER_TEMP/skills"
          python scripts/install_physicsguard_skills.py --target "$RUNNER_TEMP/skills" --check
